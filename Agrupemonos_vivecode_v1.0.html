            function resetFullGame() {
                gameState = STATE.MENU;
                score = 0; lives = 3; currentLevel = 1; totalTime = 0; maxComboReached = 1;
                paceUnlocked = false; healthUnlocked = false; maskUnlocked = false; inclusiveUnlocked = false;
                brigadista = null;
            }

            function drawShareHint() {
                ctx.fillStyle = 'rgba(224,224,224,0.75)';
                ctx.font = `${Math.min(12, Math.max(9, W/60))}px "Inter", sans-serif`;
                ctx.textAlign = 'center';
                ctx.fillText("Presioná 'C' para copiar tu puntaje y desafiar a otrx", W/2, H*0.91);
            }
            function shareScore() {
                const text = `Hice ${formatTime(totalTime)} (${score} pts) en "Unidad contra el Presidente Anarcocapitalista" 🚩 ¿Me superás? https://piquelin.github.io/inti-utiles/`;
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(()=>{
                        floatingMessages.push({ text:'¡Puntaje copiado al portapapeles!', life:1.6, color:'#ff3838', x:W/2, y:H*0.76, small:true });
                    }).catch(()=>{});
                }
            }

            function proceedAfterLevelComplete() {
                const proceedToUnlockOrNext = () => {
                    if (UNLOCK_INFO[currentLevel]) {
                        pendingUnlockLevel = currentLevel;
                        if (currentLevel === 1) paceUnlocked = true;
                        if (currentLevel === 2) healthUnlocked = true;
                        if (currentLevel === 3) maskUnlocked = true;
                        if (currentLevel === 4) inclusiveUnlocked = true;
                        gameState = STATE.ABILITY_UNLOCK;
                    } else if (currentLevel < MAX_REGULAR_LEVELS) {
                        initLevel(currentLevel + 1);
                    } else {
                        initBossLevel();
                    }
                };
                showLevelVideoModal(currentLevel, proceedToUnlockOrNext);
            }

            function handleClick() {
                if (modal.classList.contains('active')) return;
                if (devPanel.classList.contains('open')) {
                    devPanel.classList.remove('open');
                    return;
                }
                initAudio();
                const bgm = document.getElementById('bgm');
                if (bgm && bgm.paused) {
                    bgm.volume = 0.25;
                    bgm.play().catch(() => {});
                }

                if (gameState === STATE.MENU) gameState = STATE.TUTORIAL;
                else if (gameState === STATE.TUTORIAL) {
                    resetFullGame();
                    initLevel(1);
                }
                else if (gameState === STATE.LEVEL_COMPLETE) {
                    proceedAfterLevelComplete();
                }
                else if (gameState === STATE.ABILITY_UNLOCK) {
                    if (pendingUnlockLevel < MAX_REGULAR_LEVELS) initLevel(pendingUnlockLevel + 1);
                    else initBossLevel();
                }
                else if (gameState === STATE.BOSS_INTRO) { gameState = STATE.BOSS_BATTLE; bossIntroTimer = 0; }
                else if (gameState === STATE.GAME_OVER) { resetFullGame(); }
            }

            canvas.addEventListener('click', handleClick);
            window.addEventListener('keydown', e => {
                if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA' || document.activeElement.tagName === 'SELECT')) return;
                initAudio();
                const k = e.key.toLowerCase();
                keys[k] = true;
                if (k==='c' && (gameState===STATE.GAME_OVER||gameState===STATE.VICTORY)) shareScore();
                if (k==='e') useInclusiveAbility();
                if (e.key===' '||e.key==='Enter') handleClick();
            });
            window.addEventListener('keyup', e => { keys[e.key.toLowerCase()]=false; });
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
            gameState = STATE.MENU;
            requestAnimationFrame(loop);

            // ==================== BUCLE PRINCIPAL ====================
            let lastTime = performance.now();
            function loop(now) {
                resizeCanvas();
                let dt = Math.min(0.1, (now-lastTime)/1000);
                lastTime = now;
                const cfg = currentLevel <= MAX_REGULAR_LEVELS ? getLevelConfig(currentLevel) : null;
                
                if (cameraShake > 0) cameraShake = Math.max(0, cameraShake - dt*30);
                if (inclusiveFlash > 0) inclusiveFlash = Math.max(0, inclusiveFlash - dt*1.6);

                if (gameState === STATE.MENU) {
                    drawWorld();
                    drawOverlay('UNIDAD CONTRA EL PRESIDENTE', `Organizá a cada sector, sumá sus conquistas y resistí.\nRécord: ${highScore} pts`, 'HAZ CLIC PARA EMPEZAR');
                }
                else if (gameState === STATE.TUTORIAL) {
                    drawWorld();
                    ctx.fillStyle = `rgba(20, 20, 36, 0.92)`; ctx.fillRect(0,0,W,H);
                    let titleSize = Math.min(24, W / 28);
                    ctx.fillStyle='#ff3838'; ctx.font=`bold ${titleSize}px "Press Start 2P", cursive`; ctx.textAlign='center';
                    ctx.fillText('CÓMO ORGANIZARSE', W/2, H*0.11);
                    
                    ctx.fillStyle='#e0e0e0'; ctx.font=`${Math.min(15, Math.max(11, W/52))}px "Inter", sans-serif`;
                    const lines = [
                        '👥 CIUDADANOS: Tocalos para sumarlos a tu columna organizada.',
                        '⚠️ NIVEL 1 (DISCAPACIDAD): No corras sin esperar al grupo o se soltarán.',
                        '💨 GASES LACRIMÓGENOS: La policía tira gases que hacen llorar (😢) y enlentecen.',
                        '🚩 BANDERA ROJA: Aparece al juntar los necesarios y desata la marea popular.',
                        '',
                        '✨ CONQUISTAS QUE DESBLOQUEA CADA SECTOR:',
                        '🤝 Nv.1 Discapacidad: Paso Colectivo  ·  🏥 Nv.2 Jubilados: Posta de Salud (Brigadista)',
                        '🥽 Nv.3 Ciencia: Máscaras Antigás  ·  🗣️ Nv.4 Feminismos (E): Aturdir policías',
                        '',
                        'Controles: W A S D / Flechas  ·  Tecla E (Lenguaje Inclusivo)'
                    ];
                    lines.forEach((line,i)=> ctx.fillText(line, W/2, H*0.22 + i*Math.min(28, W/36)));
                    
                    ctx.fillStyle = '#ff3838'; 
                    ctx.font = `bold ${Math.min(15, Math.max(10, W/45))}px "Press Start 2P", cursive`;
                    ctx.globalAlpha = 0.5 + Math.abs(Math.sin(Date.now()*0.003))*0.5;
                    ctx.fillText('HAZ CLIC PARA JUGAR', W/2, H*0.91);
                    ctx.globalAlpha = 1;
                }
                else if (gameState === STATE.PLAYING || gameState === STATE.BOSS_BATTLE) {
                    player.update(dt);
                    if (brigadista && healthUnlocked) brigadista.update(dt);
                    citizens.forEach(c=>c.update(dt, cfg||getLevelConfig(5)));
                    policeUnits.forEach(p=>p.update(dt, player, cfg||getLevelConfig(5)));
                    if (resistanceFocus) resistanceFocus.update(dt);
                    safeZones.forEach(s=>s.update(dt));
                    gasClouds.forEach(g=>g.update(dt));
                    gasClouds = gasClouds.filter(g=>g.life > 0);
                    if (flag) flag.update(dt);

                    totalTime += dt;
                    if (inclusiveCooldown > 0) inclusiveCooldown = Math.max(0, inclusiveCooldown - dt);

                    if (bossWave.active && gameState === STATE.BOSS_BATTLE && boss) {
                        bossWave.timer -= dt;
                        for (let i=0;i<10;i++) spawnTideParticle();
                        for (let p of policeUnits) if (p.stunTimer < 1.2) p.stun(2.0);
                        if (bossWave.timer <= 0) {
                            boss.hit(25);
                            if (boss.hp <= 0) {
                                sfxVictory();
                                setVictory();
                            }
                            if (bossWave.pending > 0) {
                                bossWave.pending--;
                                bossWave.timer = 2.4;
                            } else {
                                bossWave.active = false;
                            }
                        }
                    }

                    if (gameState === STATE.BOSS_BATTLE) {
                        bossSpawnTimer -= dt;
                        const freeCount = citizens.filter(c => !c.collected).length;
                        if (bossSpawnTimer <= 0 && freeCount < 14) {
                            const allTypes = ['jubilado','discapacitado','cientifico','feminista','universitario'];
                            citizens.push(new Citizen(
                                45 + Math.random()*(W-90),
                                45 + Math.random()*(H-90),
                                allTypes[Math.floor(Math.random()*allTypes.length)]
                            ));
                            bossSpawnTimer = 1.8 + Math.random()*1.4;
                        }
                    }

                    if (mobilization.active) {
                        mobilization.timer -= dt;
                        for (let i=0;i<12;i++) spawnTideParticle();
                        for (let p of policeUnits) {
                            if (p.stunTimer>0) continue;
                            for (let pt of particles) {
                                if (pt.isTide && Math.hypot(pt.x-p.x, pt.y-p.y) < pt.radius+p.radius) {
                                    p.stun(10); pt.life = 0; break;
                                }
                            }
                        }

                        if (mobilization.timer <= 0) {
                            policeUnits.forEach(p=>p.stun(999));
                            mobilization.active = false;
                            if (mobilization.isFinal) {
                                gameState = mobilization.outcomeState;
                                if (gameState === STATE.LEVEL_COMPLETE) sfxVictory();
                            }
                        }
                    }

                    if (!mobilization.active && gameState !== STATE.GAME_OVER && gameState !== STATE.VICTORY) {
                        playerCollect();
                        policeCapture();
                        bossCapture();
                        safeZoneProtect();
                        checkNearMiss();
                        if (gameState === STATE.PLAYING && cfg) {
                            checkFlagSpawn(cfg.required);
                        } else if (gameState === STATE.BOSS_BATTLE) {
                            boss.update(dt, player);
                            bossTauntTimer -= dt;
                            if (bossTauntTimer <= 0) {
                                let next = bossTauntText;
                                while (next === bossTauntText) next = BOSS_TAUNTS[Math.floor(Math.random()*BOSS_TAUNTS.length)];
                                bossTauntText = next; bossTauntTimer = 7;
                            }
                        }
                        checkFlagCollection();
                    }

                    particles = particles.filter(p=>p.alive ? (p.update(dt), true) : false);
                    floatingMessages.forEach(m=>{ if (m.life < 1000) m.life -= dt; if (m.small) m.y -= 24*dt; });
                    floatingMessages = floatingMessages.filter(m=>m.life>0);

                    updateHUD(cfg);
                    drawWorld();
                }
                else if (gameState === STATE.BOSS_INTRO) {
                    drawWorld();

                    ctx.fillStyle = 'rgba(20, 20, 36, 0.92)';
                    ctx.fillRect(0, 0, W, H);

                    let titleSize = Math.min(22, W / 30);
                    ctx.fillStyle = '#ff3838';
                    ctx.font = `bold ${titleSize}px "Press Start 2P", cursive`;
                    ctx.textAlign = 'center';
                    ctx.shadowColor = '#000'; ctx.shadowBlur = 8;
                    ctx.fillText('¡EL PRESIDENTE APARECE!', W/2, H*0.13);
                    ctx.shadowBlur = 0;

                    ctx.fillStyle = '#e0e0e0';
                    ctx.font = `${Math.min(15, Math.max(11, W/48))}px "Inter", sans-serif`;
                    const introLines = [
                        'Con la plata que le prestó el FMI y Trump,',
                        'el presidente intenta pasar por encima del Congreso.',
                        '',
                        '¡Tenés todas las conquistas del pueblo activas:',
                        '🤝 Unidad · 🏥 Posta Salud · 🥽 Antigás · 🗣️ Inclusivo (E)!',
                        '',
                        'Organizá 4 olas populares (10, 20, 30 y 40 ciudadanos)',
                        'para derrotarlo definitivamente.'
                    ];
                    introLines.forEach((line, i) => {
                        ctx.fillText(line, W/2, H*0.26 + i*Math.min(26, W/32));
                    });

                    ctx.fillStyle = '#ff3838';
                    ctx.font = `bold ${Math.min(15, Math.max(10, W/45))}px "Press Start 2P", cursive`;
                    ctx.globalAlpha = 0.5 + Math.abs(Math.sin(Date.now()*0.003))*0.5;
                    ctx.fillText('CLIC O ENTER PARA LUCHAR', W/2, H*0.9);
                    ctx.globalAlpha = 1;

                    bossIntroTimer += dt;
                    if (bossIntroTimer > 6 || keys[' '] || keys['enter']) {
                        gameState = STATE.BOSS_BATTLE;
                        bossIntroTimer = 0;
                    }
                }
                else if (gameState === STATE.ABILITY_UNLOCK) {
                    drawWorld();
                    drawAbilityUnlockOverlay(pendingUnlockLevel);
                }
                else if (gameState === STATE.LEVEL_COMPLETE) {
                    drawWorld();
                    drawOverlay(`¡SECTOR ORGANIZADO!`, `Completaste: ${LEVEL_TITLES[currentLevel]}\nTiempo acumulado: ${formatTime(totalTime)}`, 'CONTINUAR');
                }
                else if (gameState === STATE.GAME_OVER) {
                    drawWorld();
                    const rec = score >= highScore && score > 0;
                    drawOverlay('LA ORGANIZACIÓN FRACASÓ', `La represión logró dispersar la columna.\nTiempo: ${formatTime(totalTime)} · Puntaje: ${score}` + (rec ? '\n¡Nuevo récord!' : `\nRécord: ${highScore}`), 'VOLVER A INTENTAR');
                    drawShareHint();
                }
                else if (gameState === STATE.VICTORY) {
                    drawWorld();
                }

                requestAnimationFrame(loop);
            }
        })();
    </script>
</body>
</html>
