            class TearGasCloud {
                constructor(x, y) {
                    this.x = x;
                    this.y = y;
                    this.radius = 65;
                    this.life = 7.5;
                    this.maxLife = 7.5;
                    this.seed = Math.random() * 100;
                }
                update(dt) {
                    this.life -= dt;
                }
                draw(ctx) {
                    if (this.life <= 0) return;
                    const alpha = Math.min(1, this.life / 1.5) * 0.42;
                    const pulse = Math.sin(Date.now() * 0.004 + this.seed) * 6;
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius + pulse, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(195, 220, 70, ${alpha})`;
                    ctx.fill();
                    ctx.strokeStyle = `rgba(220, 240, 100, ${alpha * 1.4})`;
                    ctx.lineWidth = 2;
                    ctx.setLineDash([6, 6]);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    for (let i = 0; i < 3; i++) {
                        const ang = this.seed + i * 2.1 + Date.now() * 0.0015;
                        const ox = Math.cos(ang) * (this.radius * 0.38);
                        const oy = Math.sin(ang) * (this.radius * 0.38);
                        ctx.beginPath();
                        ctx.arc(this.x + ox, this.y + oy, this.radius * 0.45, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(180, 210, 60, ${alpha * 0.75})`;
                        ctx.fill();
                    }

                    ctx.font = '22px "Segoe UI Emoji", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.globalAlpha = Math.min(1, this.life);
                    ctx.fillText('💨', this.x, this.y);
                    ctx.restore();
                }
            }

            // NPC Aliado: Brigadista de la Posta de Salud que busca y cura a los afectados
            class HealthBrigadista {
                constructor(x, y) {
                    this.x = x;
                    this.y = y;
                    this.radius = 20;
                    this.speed = 3.1;
                    this.emoji = '🧑🏽‍⚕️';
                    this.healCooldown = 0;
                    this.patrolAngle = Math.random() * Math.PI * 2;
                }
                update(dt) {
                    if (devConfig.healMode === 'posta') return; // En modo "Solo Posta", no sale a buscar
                    if (this.healCooldown > 0) this.healCooldown -= dt;

                    // Buscar el objetivo gaseado más prioritario:
                    // 1) Alguien en la columna del jugador que esté gaseado
                    // 2) Ciudadanos sueltos en el mapa que estén gaseados (😢)
                    let target = null;
                    let minDist = Infinity;

                    if (player) {
                        const hasGassedInCol = player.collected.some(c => c.gassed > 0) || player.inGas;
                        if (hasGassedInCol) {
                            target = player;
                            minDist = Math.hypot(player.x - this.x, player.y - this.y) * 0.75; // Prioridad a la columna
                        }
                    }

                    for (let c of citizens) {
                        if (c.collected || c.gassed <= 0) continue;
                        const d = Math.hypot(c.x - this.x, c.y - this.y);
                        if (d < minDist) {
                            minDist = d;
                            target = c;
                        }
                    }

                    if (target) {
                        // Moverse decididamente hacia el afectado o la columna
                        const ang = Math.atan2(target.y - this.y, target.x - this.x);
                        this.x += Math.cos(ang) * this.speed * dt * 60;
                        this.y += Math.sin(ang) * this.speed * dt * 60;
                    } else if (player) {
                        // Si no hay nadie gaseado, orbitar suavemente cerca de la Posta / jugador como escolta sanitario
                        const homeX = resistanceFocus ? (resistanceFocus.x * 0.5 + player.x * 0.5) : player.x;
                        const homeY = resistanceFocus ? (resistanceFocus.y * 0.5 + player.y * 0.5) : player.y;
                        const dHome = Math.hypot(homeX - this.x, homeY - this.y);
                        if (dHome > 90) {
                            const ang = Math.atan2(homeY - this.y, homeX - this.x);
                            this.x += Math.cos(ang) * (this.speed * 0.65) * dt * 60;
                            this.y += Math.sin(ang) * (this.speed * 0.65) * dt * 60;
                        } else {
                            this.patrolAngle += dt * 1.2;
                            this.x += Math.cos(this.patrolAngle) * 0.8 * dt * 60;
                            this.y += Math.sin(this.patrolAngle) * 0.8 * dt * 60;
                        }
                    }

                    this.x = Math.max(this.radius, Math.min(W - this.radius, this.x));
                    this.y = Math.max(this.radius, Math.min(H - this.radius, this.y));

                    // Curar a ciudadanos sueltos cuando los toca (con inmunidad temporal para no quedar en loop dentro de la nube)
                    for (let c of citizens) {
                        if (c.collected || c.gassed <= 0) continue;
                        if (Math.hypot(c.x - this.x, c.y - this.y) < this.radius + c.radius + 10) {
                            c.gassed = 0;
                            c.gasImmunity = 4.0;
                            // Impulsar al ciudadano hacia afuera si está pisando una nube de gas
                            for (let g of gasClouds) {
                                if (Math.hypot(c.x - g.x, c.y - g.y) < g.radius + c.radius) {
                                    c.wanderAngle = Math.atan2(c.y - g.y, c.x - g.x);
                                    c.wanderTimer = 2.0;
                                    break;
                                }
                            }
                            sfxHeal();
                            spawnHealParticles(c.x, c.y);
                            floatingMessages.push({
                                text: '➕ ¡Atendidx!',
                                life: 1.1, color: '#2ed573',
                                x: c.x, y: c.y - 30, small: true
                            });
                        }
                    }

                    // Curar a la gente de la columna cuando toca al jugador o a cualquier integrante de la columna
                    if (player && this.healCooldown <= 0) {
                        let touchedColumn = Math.hypot(player.x - this.x, player.y - this.y) < this.radius + player.radius + 14;
                        if (!touchedColumn) {
                            for (let c of player.collected) {
                                if (Math.hypot(c.x - this.x, c.y - this.y) < this.radius + c.radius + 12) {
                                    touchedColumn = true;
                                    break;
                                }
                            }
                        }
                        if (touchedColumn) {
                            let cured = 0;
                            if (player.inGas && player.gasImmunity <= 0) {
                                player.gasImmunity = 3.5;
                                cured++;
                            }
                            for (let c of player.collected) {
                                if (c.gassed > 0) {
                                    c.gassed = 0;
                                    c.gasImmunity = 4.0;
                                    spawnHealParticles(c.x, c.y);
                                    cured++;
                                }
                            }
                            if (cured > 0) {
                                this.healCooldown = 1.5;
                                sfxHeal();
                                floatingMessages.push({
                                    text: `🏥 ¡Brigadista curó a la columna!`,
                                    life: 1.3, color: '#2ed573',
                                    x: player.x, y: player.y - 42, small: true
                                });
                            }
                        }
                    }
                }
                draw(ctx) {
                    if (devConfig.healMode === 'posta') return;
                    ctx.save();
                    // Halo sanitario verde/blanco
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius + 4, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(46, 213, 115, 0.6)';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#e8f8f5';
                    ctx.fill();
                    ctx.strokeStyle = '#2ed573';
                    ctx.lineWidth = 2.5;
                    ctx.stroke();

                    ctx.font = '24px "Segoe UI Emoji", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(this.emoji, this.x, this.y + 2);

                    ctx.font = '13px "Segoe UI Emoji", sans-serif';
                    ctx.fillText('➕', this.x + this.radius - 3, this.y - this.radius + 3);
                    ctx.restore();
                }
            }

            class Player {
                constructor(x, y) {
                    this.x = x; this.y = y; this.radius = 22;
                    // En Nivel 1 (sin paceUnlocked), el protagonista corre más rápido (4.5) pero debe cuidar de no dejar atrás a la fila.
                    // Desde Nivel 2 (con paceUnlocked), ajusta su velocidad al paso colectivo (3.45).
                    this.speed = (!paceUnlocked && currentLevel === 1) ? 4.55 : 3.45;
                    this.collected = []; this.trail = [];
                    this.invuln = 0; this.speedBoost = 0; this.shield = false; this.shieldTimer = 0;
                    this.facing = 1;
                    this.inGas = false;
                    this.gasImmunity = 0;
                    this.strainWarningCooldown = 0;
                }
                update(dt) {
                    this.speed = (!paceUnlocked && currentLevel === 1) ? 4.55 : 3.45;
                    if (this.strainWarningCooldown > 0) this.strainWarningCooldown -= dt;
                    if (this.gasImmunity > 0) this.gasImmunity = Math.max(0, this.gasImmunity - dt);

                    let dx = 0, dy = 0;
                    if (keys['w']||keys['arrowup']) dy=-1;
                    if (keys['s']||keys['arrowdown']) dy=1;
                    if (keys['a']||keys['arrowleft']) { dx=-1; this.facing = -1; }
                    if (keys['d']||keys['arrowright']) { dx=1; this.facing = 1; }
                    dx += mobileDir.x; dy += mobileDir.y;
                    const mag = Math.sqrt(dx*dx+dy*dy);
                    if (mag > 1) { dx /= mag; dy /= mag; }

                    // Chequear si el jugador o su columna pisan gas lacrimógeno
                    this.inGas = false;
                    if (this.gasImmunity <= 0) {
                        for (let g of gasClouds) {
                            if (Math.hypot(this.x - g.x, this.y - g.y) < g.radius + this.radius * 0.5) {
                                this.inGas = true;
                                break;
                            }
                        }
                    }

                    // Los integrantes de la columna que pasan sobre gas también se ven afectados (salvo inmunidad post-curación)
                    for (let c of this.collected) {
                        if (c.gasImmunity > 0) {
                            c.gasImmunity = Math.max(0, c.gasImmunity - dt);
                        } else {
                            for (let g of gasClouds) {
                                if (Math.hypot(c.x - g.x, c.y - g.y) < g.radius + c.radius * 0.4) {
                                    c.gassed = Math.max(c.gassed, maskUnlocked ? 2.5 : 5.5);
                                }
                            }
                        }
                        if (c.gassed > 0) {
                            // Recuperación natural lenta (más rápida si tienen máscaras del Nv.3)
                            c.gassed = Math.max(0, c.gassed - dt * (maskUnlocked ? 0.55 : 0.18));
                        }
                    }

                    // Penalización por gas:
                    // Con Máscaras Antigás (Nv.3), el gas enlentece mucho menos (solo 18% en vez de 45%)
                    const gasPlayerFactor = this.inGas ? (maskUnlocked ? 0.82 : 0.55) : 1.0;
                    const gassedInCol = this.collected.filter(c => c.gassed > 0).length;
                    const perCitizenGasPenalty = maskUnlocked ? 0.025 : 0.06;
                    const colGasFactor = Math.max(maskUnlocked ? 0.78 : 0.52, 1 - gassedInCol * perCitizenGasPenalty);

                    const comboSpeedBonus = (comboMultiplier - 1) * 0.18;
                    let spd = (this.speed + this.speedBoost + comboSpeedBonus) * gasPlayerFactor * colGasFactor;

                    this.x += dx * spd * dt * 60;
                    this.y += dy * spd * dt * 60;
                    this.x = Math.max(this.radius, Math.min(W-this.radius, this.x));
                    this.y = Math.max(this.radius, Math.min(H-this.radius, this.y));
                    this.trail.push({x:this.x, y:this.y});
                    if (this.trail.length > 35) this.trail.shift();
                    if (this.invuln > 0) this.invuln -= dt;
                    if (this.speedBoost > 0) this.speedBoost = Math.max(0, this.speedBoost - dt*0.8);
                    if (this.shieldTimer > 0) { this.shieldTimer -= dt; if (this.shieldTimer<=0) this.shield=false; }

                    // Movimiento de los seguidores en la columna:
                    if (!paceUnlocked && currentLevel === 1) {
                        // MECÁNICA NIVEL 1 (Personas con Discapacidad):
                        // Los seguidores avanzan más lento que la velocidad máxima del protagonista.
                        // Si te alejás demasiado rápido sin esperarlos, se estira la fila y perdés al último.
                        for (let i = 0; i < this.collected.length; i++) {
                            const c = this.collected[i];
                            const leader = (i === 0) ? this : this.collected[i - 1];
                            const targetDist = 30;
                            const d = Math.hypot(leader.x - c.x, leader.y - c.y);
                            if (d > targetDist) {
                                const ang = Math.atan2(leader.y - c.y, leader.x - c.x);
                                // Velocidad máxima del seguidor (3.05 vs 4.55 del jugador)
                                const maxFollowSpd = 3.05 * (c.gassed > 0 ? 0.6 : 1.0);
                                const step = Math.min(d - targetDist, maxFollowSpd * dt * 60);
                                c.x += Math.cos(ang) * step;
                                c.y += Math.sin(ang) * step;
                            }
                            c.linkDist = d;
                        }

                        // Verificar si el último o algún eslabón quedó demasiado lejos
                        for (let i = this.collected.length - 1; i >= 0; i--) {
                            const c = this.collected[i];
                            if (c.linkDist > 110 && this.strainWarningCooldown <= 0) {
                                this.strainWarningCooldown = 1.4;
                                floatingMessages.push({
                                    text: '⚠️ ¡Vas muy rápido, esperá al grupo!',
                                    life: 1.2, color: '#eccc68',
                                    x: c.x, y: c.y - 32, small: true
                                });
                            }
                            if (c.linkDist > 165) {
                                // Se suelta desde este eslabón hasta el final de la cola
                                const dropped = this.collected.splice(i);
                                for (let dc of dropped) {
                                    dc.free = true;
                                    dc.collected = false;
                                    dc.pickupLock = 1.0;
                                    dc.wanderAngle = Math.random() * Math.PI * 2;
                                    citizens.push(dc);
                                }
                                sfxDrop();
                                resetCombo();
                                floatingMessages.push({
                                    text: '¡Alguien quedó atrás! Caminá más despacio',
                                    life: 1.8, color: '#ff6b81',
                                    x: this.x, y: this.y - 45, small: true
                                });
                                break;
                            }
                        }
                    } else {
                        // A partir del Nivel 2 (Paso Colectivo): nadie se queda atrás
                        for (let i=0; i<this.collected.length; i++) {
                            const c = this.collected[i];
                            const idx = Math.min(i+3, this.trail.length-1);
                            const t = this.trail[this.trail.length-1-idx] || {x:this.x, y:this.y};
                            const angle = i*1.2 + Date.now()*0.002;
                            const dist = 22 + (i%5)*8;
                            c.x += (t.x + Math.cos(angle)*dist - c.x) * 0.15;
                            c.y += (t.y + Math.sin(angle)*dist - c.y) * 0.15;
                            c.linkDist = 0;
                        }
                    }
                }
                draw(ctx) {
                    // En Nivel 1, dibujar líneas de unión entre eslabones para que se vea cuando se tensa la fila
                    if (!paceUnlocked && currentLevel === 1 && this.collected.length > 0) {
                        for (let i = 0; i < this.collected.length; i++) {
                            const c = this.collected[i];
                            const leader = (i === 0) ? this : this.collected[i - 1];
                            const d = Math.hypot(leader.x - c.x, leader.y - c.y);
                            ctx.beginPath();
                            ctx.moveTo(leader.x, leader.y);
                            ctx.lineTo(c.x, c.y);
                            if (d > 105) {
                                ctx.strokeStyle = '#ff4757';
                                ctx.lineWidth = 3;
                                ctx.setLineDash([4, 4]);
                            } else if (d > 75) {
                                ctx.strokeStyle = '#eccc68';
                                ctx.lineWidth = 2;
                                ctx.setLineDash([]);
                            } else {
                                ctx.strokeStyle = 'rgba(255, 56, 56, 0.45)';
                                ctx.lineWidth = 2;
                                ctx.setLineDash([]);
                            }
                            ctx.stroke();
                            ctx.setLineDash([]);
                        }
                    }

                    if (this.shield) {
                        ctx.beginPath(); ctx.arc(this.x,this.y,this.radius+8,0,Math.PI*2);
                        ctx.fillStyle='rgba(46, 213, 115, 0.3)'; ctx.fill();
                    }
                    if (this.invuln>0 && Math.floor(this.invuln*20)%2===0) ctx.globalAlpha=0.5;
                    
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.scale(this.facing, 1);
                    
                    ctx.fillStyle = '#ff3838'; 
                    ctx.beginPath(); ctx.roundRect(-this.radius, -this.radius, this.radius*2, this.radius*2, 8); ctx.fill();
                    ctx.strokeStyle = '#2f3542'; ctx.lineWidth = 2; ctx.stroke();
                    
                    ctx.fillStyle = '#ffeaa7';
                    ctx.beginPath(); ctx.roundRect(-this.radius+6, -this.radius+4, this.radius*2-8, this.radius, 4); ctx.fill();

                    if (maskUnlocked) {
                        ctx.fillStyle = '#70a1ff';
                        ctx.strokeStyle = '#1e272e';
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.roundRect(-this.radius+8, -this.radius+6, this.radius*2-12, 9, 3);
                        ctx.fill();
                        ctx.stroke();
                    }
                    
                    ctx.fillStyle = '#f1f2f6';
                    ctx.beginPath();
                    ctx.moveTo(this.radius, 0);
                    ctx.lineTo(this.radius + 12, -8);
                    ctx.lineTo(this.radius + 12, 8);
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = '#2f3542'; ctx.lineWidth = 1; ctx.stroke();

                    ctx.restore();
                    ctx.globalAlpha = 1;

                    if (this.inGas) {
                        ctx.font = '18px "Segoe UI Emoji", sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText(maskUnlocked ? '🥽' : '😢', this.x, this.y - this.radius - 10);
                    }

                    if (this.collected.length>=6) {
                        ctx.beginPath(); ctx.arc(this.x,this.y,this.radius+10,0,Math.PI*2);
                        ctx.strokeStyle='#ff3838'; ctx.lineWidth=2; ctx.setLineDash([4,4]); ctx.stroke(); ctx.setLineDash([]);
                    }
                }
                getStrength() { return this.collected.length; }
                addCitizen(c) {
                    if (this.collected.length < 50) {
                        c.free = false; c.collected = true;
                        // En Nivel 1 lo ubicamos detrás del último eslabón para que no salte de golpe
                        if (!paceUnlocked && currentLevel === 1 && this.collected.length > 0) {
                            const last = this.collected[this.collected.length - 1];
                            const d = Math.hypot(c.x - last.x, c.y - last.y);
                            if (d > 65) {
                                const ang = Math.atan2(c.y - last.y, c.x - last.x);
                                c.x = last.x + Math.cos(ang) * 45;
                                c.y = last.y + Math.sin(ang) * 45;
                            }
                        }
                        this.collected.push(c); sfxCollect();
                        if (this.collected.length === 8 && paceUnlocked) this.speedBoost = 2.0;
                        if (this.collected.length === 15) { this.shield = true; this.shieldTimer = 8; }
                        
                        for(let i=0; i<5; i++) {
                            particles.push({
                                x: c.x, y: c.y,
                                color: '#ff3838', life: 0.5,
                                vx: (Math.random()-0.5)*100, vy: (Math.random()-0.5)*100,
                                radius: 3,
                                update(dt) { this.life-=dt; this.x+=this.vx*dt; this.y+=this.vy*dt; },
                                draw(ctx) { ctx.globalAlpha = this.life*2; ctx.fillStyle=this.color; ctx.beginPath(); ctx.arc(this.x,this.y,this.radius,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; },
                                alive() { return this.life>0; }
                            });
                        }
                    }
                }
                loseCitizens(n) {
                    const lost = [];
                    for (let i=0; i<n && this.collected.length>0; i++) {
                        const c = this.collected.pop();
                        c.free = true; c.collected = false;
                        c.x = Math.max(c.radius, Math.min(W-c.radius, this.x + (Math.random()-0.5)*80));
                        c.y = Math.max(c.radius, Math.min(H-c.radius, this.y + (Math.random()-0.5)*80));
                        c.pickupLock = 1.1;
                        c.scatter = (devConfig.edgeMode === 'clasico') ? 1.5 : 0.4;
                        c.wanderAngle = Math.random() * Math.PI * 2;
                        lost.push(c);
                        citizens.push(c);
                    }
                    this.invuln = 1.0;
                    cameraShake = 10; 
                    return lost;
                }
            }

            class Citizen {
                constructor(x, y, type) {
                    this.x = x; this.y = y; this.radius = 22;
                    this.free = true; this.collected = false;
                    this.wanderAngle = Math.random()*Math.PI*2;
                    this.wanderTimer = Math.random()*3;
                    this.speed = 0.6;
                    this.scatter = 0;
                    this.pickupLock = 0;
                    this.gassed = 0;
                    this.gasImmunity = 0;
                    this.linkDist = 0;
                    this.type = type;
                    this.emoji = this.getEmoji();
                    this.cryEmoji = Math.random() < 0.5 ? '😢' : '😭';
                }
                getEmoji() {
                    if (this.type === 'discapacitado') return ['👨‍🦽','👩🏻‍🦽','👩‍🦯','🧑🏼‍🦯'][Math.floor(Math.random()*4)];
                    if (this.type === 'jubilado') return ['👴🏽','👵🏽','🧓🏼','👩🏽‍🦳'][Math.floor(Math.random()*4)];
                    if (this.type === 'cientifico') return ['👩🏻‍⚕️','👩‍🔬','🔬','👨🏽‍🔬'][Math.floor(Math.random()*4)];
                    if (this.type === 'feminista') return ['👩🏽','👩🏻','👩🏿','🦱','🪂','👬','👭'][Math.floor(Math.random()*7)];
                    if (this.type === 'universitario') return ['👩🏽‍🎓','👩🏻‍🏫','👩‍🔬','🧑🏻‍💼','👩🏻‍💼'][Math.floor(Math.random()*5)];
                    return '👤';
                }
                update(dt, config) {
                    if (this.collected) return;
                    if (this.pickupLock > 0) this.pickupLock = Math.max(0, this.pickupLock - dt);
                    if (this.gasImmunity > 0) this.gasImmunity = Math.max(0, this.gasImmunity - dt);

                    // Verificar si pisa una nube de gas lacrimógeno (solo si no tiene inmunidad post-curación)
                    if (this.gasImmunity <= 0) {
                        for (let g of gasClouds) {
                            if (Math.hypot(this.x - g.x, this.y - g.y) < g.radius + this.radius * 0.6) {
                                this.gassed = Math.max(this.gassed, maskUnlocked ? 3.5 : 6.5);
                            }
                        }
                    }

                    if (this.gassed > 0) {
                        this.gassed = Math.max(0, this.gassed - dt * (maskUnlocked ? 0.5 : 0.2));
                        if (resistanceFocus && resistanceFocus.active && resistanceFocus.contains(this.x, this.y, this.radius)) {
                            this.gassed = 0;
                            this.gasImmunity = 4.0;
                            spawnHealParticles(this.x, this.y);
                        }
                    }

                    if (this.scatter > 0) {
                        this.scatter -= dt;
                        if (devConfig.edgeMode === 'clasico') {
                            this.x += (Math.random()-0.5)*4;
                            this.y += (Math.random()-0.5)*4;
                            return;
                        }
                    }

                    // Si está gaseado se enlentece (con Máscaras Antigás del Nv.3 se enlentece menos: 62% vs 28%)
                    const gasSlow = this.gassed > 0 ? (maskUnlocked ? 0.62 : 0.28) : 1.0;
                    this.speed = config.citizenSpeed * gasSlow;
                    this.wanderTimer -= dt;
                    if (this.wanderTimer <= 0) {
                        this.wanderAngle += (Math.random()-0.5)*1.5;
                        this.wanderTimer = 1.5 + Math.random()*2.5;
                    }

                    if (devConfig.edgeMode === 'rebote_repulsion') {
                        const margin = 52;
                        let steerX = Math.cos(this.wanderAngle);
                        let steerY = Math.sin(this.wanderAngle);
                        if (this.x < margin) steerX += (margin - this.x) / margin * 1.4;
                        if (this.x > W - margin) steerX -= (this.x - (W - margin)) / margin * 1.4;
                        if (this.y < margin) steerY += (margin - this.y) / margin * 1.4;
                        if (this.y > H - margin) steerY -= (this.y - (H - margin)) / margin * 1.4;
                        this.wanderAngle = Math.atan2(steerY, steerX);
                    }

                    this.x += Math.cos(this.wanderAngle)*this.speed*dt*60;
                    this.y += Math.sin(this.wanderAngle)*this.speed*dt*60;

                    if (devConfig.edgeMode !== 'clasico') {
                        if (this.x <= this.radius) { this.x = this.radius; this.wanderAngle = Math.PI - this.wanderAngle; }
                        else if (this.x >= W - this.radius) { this.x = W - this.radius; this.wanderAngle = Math.PI - this.wanderAngle; }
                        if (this.y <= this.radius) { this.y = this.radius; this.wanderAngle = -this.wanderAngle; }
                        else if (this.y >= H - this.radius) { this.y = H - this.radius; this.wanderAngle = -this.wanderAngle; }
                    } else {
                        this.x = Math.max(this.radius, Math.min(W-this.radius, this.x));
                        this.y = Math.max(this.radius, Math.min(H-this.radius, this.y));
                    }
                }
                draw(ctx) {
                    if (this.collected) return;
                    ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
                    if (this.gassed > 0) {
                        ctx.fillStyle = '#d2dae2';
                        ctx.fill();
                        ctx.strokeStyle = '#badc58'; ctx.lineWidth = 3; ctx.stroke();
                    } else if (this.gasImmunity > 0) {
                        ctx.fillStyle = '#e8f8f5';
                        ctx.fill();
                        ctx.strokeStyle = '#2ed573'; ctx.lineWidth = 2.5; ctx.stroke();
                    } else {
                        ctx.fillStyle = '#ffffff';
                        ctx.fill();
                        ctx.strokeStyle = '#2f3542'; ctx.lineWidth = 2; ctx.stroke();
                    }

                    ctx.fillStyle = '#000';
                    ctx.font = '28px "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(this.gassed > 0 ? this.cryEmoji : this.emoji, this.x, this.y+2);

                    if (this.gassed > 0) {
                        ctx.font = '14px "Segoe UI Emoji", sans-serif';
                        ctx.fillText('💨', this.x + this.radius - 4, this.y - this.radius + 4);
                    }
                }
                drawCollected(ctx, x, y) {
                    ctx.save(); ctx.translate(x, y);
                    ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI*2);
                    ctx.fillStyle = this.gassed > 0 ? '#a4b0be' : '#ff3838';
                    ctx.fill();
                    ctx.strokeStyle = this.gassed > 0 ? '#badc58' : '#ff6b6b';
                    ctx.lineWidth = 2; ctx.stroke();
                    ctx.fillStyle = '#000';
                    ctx.font = '28px "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(this.gassed > 0 ? this.cryEmoji : this.emoji, 0, 2);
                    ctx.restore();
                }
            }

            class PoliceUnit {
                constructor(x, y, speed) {
                    this.x = x; this.y = y; this.radius = 22;
                    this.speed = speed; this.state = 'patrol'; this.stunTimer = 0;
                    this.patrolAngle = Math.random()*Math.PI*2; this.patrolTimer = 0;
                    this.facing = -1;
                    this.nearMissCd = 0;
                    this.gasCooldown = 3.5 + Math.random() * 6.0;
                    this.emoji = Math.random() < 0.5 ? '🧑🏻‍✈️' : '👩🏻‍✈️';
                }
                update(dt, playerRef, config) {
                    if (this.stunTimer>0) { this.stunTimer-=dt; return; }
                    if (this.nearMissCd>0) this.nearMissCd-=dt;
                    this.speed = config.policeSpeed;

                    const gasAllowed = devConfig.gasRate === 'intenso' || (devConfig.gasRate === 'normal' && currentLevel >= 2);
                    if (gasAllowed) {
                        this.gasCooldown -= dt * (devConfig.gasRate === 'intenso' ? 1.7 : 1.0);
                        const maxClouds = devConfig.gasRate === 'intenso' ? 5 : 3;
                        if (this.gasCooldown <= 0 && gasClouds.length < maxClouds) {
                            const inFocus = resistanceFocus && resistanceFocus.contains(this.x, this.y, 85);
                            if (!inFocus) {
                                gasClouds.push(new TearGasCloud(this.x, this.y));
                                sfxGas();
                            }
                            this.gasCooldown = 8.5 + Math.random() * 6.0;
                        }
                    }

                    let target = null, minDist = Infinity;
                    if (playerRef && playerRef.getStrength()>0) {
                        const d = Math.hypot(this.x-playerRef.x, this.y-playerRef.y);
                        if (d<300) { target=playerRef; minDist=d; }
                    }
                    for (let c of citizens) {
                        if (c.collected || c.scatter>0) continue;
                        if (devConfig.edgeMode === 'rebote_repulsion' && (c.x < 55 || c.x > W-55 || c.y < 55 || c.y > H-55)) continue;
                        const d = Math.hypot(this.x-c.x, this.y-c.y);
                        if (d<190 && d<minDist) { target=c; minDist=d; }
                    }
                    if (target && minDist<250) {
                        this.state = 'chase';
                        const angle = Math.atan2(target.y-this.y, target.x-this.x);
                        this.x += Math.cos(angle)*this.speed*1.2*dt*60;
                        this.y += Math.sin(angle)*this.speed*1.2*dt*60;
                        this.facing = Math.cos(angle) > 0 ? 1 : -1;
                    } else {
                        this.state = 'patrol';
                        this.patrolTimer -= dt;
                        if (this.patrolTimer<=0) { this.patrolAngle+=(Math.random()-0.5)*2; this.patrolTimer=2+Math.random()*3; }

                        if (devConfig.edgeMode === 'rebote_repulsion') {
                            const margin = 55;
                            let sx = Math.cos(this.patrolAngle);
                            let sy = Math.sin(this.patrolAngle);
                            if (this.x < margin) sx += 0.9;
                            if (this.x > W - margin) sx -= 0.9;
                            if (this.y < margin) sy += 0.9;
                            if (this.y > H - margin) sy -= 0.9;
                            this.patrolAngle = Math.atan2(sy, sx);
                        }

                        this.x += Math.cos(this.patrolAngle)*this.speed*0.55*dt*60;
                        this.y += Math.sin(this.patrolAngle)*this.speed*0.55*dt*60;
                        this.facing = Math.cos(this.patrolAngle) > 0 ? 1 : -1;
                    }

                    if (devConfig.edgeMode !== 'clasico') {
                        if (this.x <= this.radius) { this.x = this.radius; this.patrolAngle = Math.PI - this.patrolAngle; }
                        else if (this.x >= W - this.radius) { this.x = W - this.radius; this.patrolAngle = Math.PI - this.patrolAngle; }
                        if (this.y <= this.radius) { this.y = this.radius; this.patrolAngle = -this.patrolAngle; }
                        else if (this.y >= H - this.radius) { this.y = H - this.radius; this.patrolAngle = -this.patrolAngle; }
                    } else {
                        this.x = Math.max(this.radius, Math.min(W-this.radius, this.x));
                        this.y = Math.max(this.radius, Math.min(H-this.radius, this.y));
                    }
                }
                draw(ctx) {
                    if (this.stunTimer>0 && Math.floor(this.stunTimer*15)%2===0) return;
                    
                    ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
                    ctx.fillStyle = '#1e90ff'; ctx.fill();
                    ctx.strokeStyle = '#2f3542'; ctx.lineWidth = 2; ctx.stroke();
                    
                    ctx.fillStyle = '#000';
                    ctx.font = '28px "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(this.emoji, this.x, this.y+2);

                    if (this.stunTimer > 0.6) {
                        ctx.font = '22px "Segoe UI Emoji", sans-serif';
                        ctx.fillText('💬', this.x, this.y - this.radius - 10);
                    }
                }
                stun(d) { this.stunTimer = d; this.state = 'stunned'; }
            }

            class SafeZone {
                constructor(x, y, radius, permanent, name = '', message = '') {
                    this.x = x; this.y = y; this.radius = radius;
                    this.timer = permanent ? Infinity : 10; this.active = true;
                    this.permanent = permanent;
                    this.phase = Math.random()*Math.PI*2;
                    this.name = name;
                    this.message = message;
                    this.messageShown = false; 
                }
                update(dt) {
                    if (!this.permanent) { this.timer -= dt; if (this.timer <= 0) this.active = false; }
                    this.phase += dt*2;
                }
                draw(ctx) {
                    const alpha = this.active ? (0.3 + Math.sin(this.phase)*0.1) : 0;
                    ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
                    ctx.fillStyle = `rgba(46, 213, 115, ${alpha})`; ctx.fill();
                    ctx.strokeStyle = `rgba(46, 213, 115, ${alpha * 2})`; ctx.lineWidth = 2;
                    ctx.setLineDash([8,4]); ctx.stroke(); ctx.setLineDash([]);

                    if (healthUnlocked && this === resistanceFocus) {
                        ctx.font = '18px "Segoe UI Emoji", sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText('🏥', this.x, this.y + this.radius - 14);
                    }
                    
                    if (this.name) {
                        ctx.fillStyle = '#2ed573'; 
                        ctx.font = 'bold 12px "Inter", sans-serif'; 
                        ctx.textAlign = 'center';
                        ctx.shadowColor = '#000'; ctx.shadowBlur = 4;
                        ctx.fillText(this.name, this.x, this.y - this.radius - 10);
                        ctx.shadowBlur = 0;
                    }
                }
                contains(px, py, r=0) { return Math.hypot(px - this.x, py - this.y) < this.radius + r; }
            }

            class Flag {
                constructor(x,y) { this.x=x; this.y=y; this.poleX=x; this.poleY=y-25; this.wave=0; this.active=true; }
                update(dt) { this.wave+=dt*5; }
                draw(ctx) {
                    ctx.strokeStyle='#bdc3c7'; ctx.lineWidth=4;
                    ctx.beginPath(); ctx.moveTo(this.poleX,this.poleY); ctx.lineTo(this.poleX,this.poleY+50); ctx.stroke();
                    const off=Math.sin(this.wave)*4;
                    ctx.fillStyle='#ff3838';
                    ctx.beginPath(); ctx.moveTo(this.poleX,this.poleY); ctx.lineTo(this.poleX+40+off,this.poleY+15);
                    ctx.lineTo(this.poleX+35+off,this.poleY+25); ctx.lineTo(this.poleX,this.poleY+30); ctx.closePath(); ctx.fill();
                    ctx.fillStyle='white'; ctx.font='bold 16px sans-serif'; ctx.textAlign='center';
                    ctx.fillText('★',this.poleX+18,this.poleY+18); ctx.textAlign='start';
                    const pulse = (Math.sin(this.wave*1.5)+1)/2;
                    ctx.beginPath(); ctx.arc(this.poleX+18, this.poleY+25, 40+pulse*22, 0, Math.PI*2);
                    ctx.strokeStyle = 'rgba(255,56,56,'+(0.55-pulse*0.4)+')'; ctx.lineWidth=2; ctx.stroke();
                    const bobY = Math.sin(this.wave*1.8)*5;
                    ctx.fillStyle = '#ff3838';
                    ctx.beginPath(); ctx.moveTo(this.poleX+10, this.poleY-26+bobY); ctx.lineTo(this.poleX+26, this.poleY-26+bobY); ctx.lineTo(this.poleX+18, this.poleY-13+bobY); ctx.closePath(); ctx.fill();
                }
            }

            class Boss {
                constructor(x,y) {
                    this.x=x; this.y=y; this.radius=45; this.speed=2.0; this.hp=100; this.maxHp=100;
                    this.phase=1; this.angle=0; this.reach=65; this.cooldown=0;
                    this.charge=false; this.chargeTarget=null; this.stunTimer=0;
                }
                update(dt, playerRef) {
                    if (this.stunTimer>0) { this.stunTimer-=dt; this.angle+=dt*8; return; }
                    this.angle += dt*(12+this.phase*3);
                    this.cooldown -= dt;
                    if (this.hp<50 && this.phase===1) { this.phase=2; this.speed=2.8; }
                    if (this.charge) {
                        const ang = Math.atan2(this.chargeTarget.y-this.y, this.chargeTarget.x-this.x);
                        this.x += Math.cos(ang)*6*dt*60;
                        this.y += Math.sin(ang)*6*dt*60;
                        if (Math.hypot(this.x-this.chargeTarget.x, this.y-this.chargeTarget.y)<30 || this.cooldown<-1) {
                            this.charge=false; this.cooldown=1.5;
                        }
                    } else if (playerRef && this.cooldown<=0) {
                        const d = Math.hypot(this.x-playerRef.x, this.y-playerRef.y);
                        if (d<350) {
                            this.chargeTarget = {x:playerRef.x, y:playerRef.y};
                            this.charge = true;
                            this.cooldown = 2.5 - this.phase*0.5;
                        } else {
                            const ang = Math.atan2(playerRef.y-this.y, playerRef.x-this.x);
                            this.x += Math.cos(ang)*this.speed*dt*60;
                            this.y += Math.sin(ang)*this.speed*dt*60;
                        }
                    }
                    this.x = Math.max(this.radius, Math.min(W-this.radius, this.x));
                    this.y = Math.max(this.radius, Math.min(H-this.radius, this.y));
                }
                draw(ctx) {
                    if (assets.boss.complete && assets.boss.naturalWidth > 0) {
                        ctx.save();
                        ctx.translate(this.x, this.y);
                        if (this.chargeTarget && this.chargeTarget.x < this.x) {
                            ctx.scale(-1, 1);
                        }
                        const bob = Math.sin(Date.now()*0.01) * 3;
                        ctx.drawImage(assets.boss, -this.radius, -this.radius + bob, this.radius * 2, this.radius * 2);
                        ctx.restore();
                    } else {
                        ctx.fillStyle = '#1e90ff';
                        ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill();
                        ctx.strokeStyle = '#f1c40f'; ctx.lineWidth=4; ctx.stroke();
                        ctx.fillStyle = '#fff'; ctx.font='20px sans-serif'; ctx.textAlign='center';
                        ctx.fillText('BOSS', this.x, this.y+7);
                    }
                    
                    ctx.fillStyle = '#2f3542';
                    ctx.fillRect(this.x - 40, this.y - this.radius - 20, 80, 10);
                    ctx.fillStyle = '#ff3838';
                    ctx.fillRect(this.x - 40, this.y - this.radius - 20, 80 * (this.hp / this.maxHp), 10);
                    ctx.strokeStyle = '#fff';
                    ctx.strokeRect(this.x - 40, this.y - this.radius - 20, 80, 10);
                }
                hit(dmg) { 
                    this.hp -= dmg; 
                    this.stunTimer=0.8; 
                    this.charge=false; 
                    if (this.hp<=0) this.hp=0; 
                    cameraShake = 15;
                    
                    for(let i=0; i<15; i++) {
                        particles.push({
                            x: this.x, y: this.y,
                            color: '#ff3838', life: 1.0,
                            vx: (Math.random()-0.5)*200, vy: (Math.random()-0.5)*200,
                            radius: 4,
                            update(dt) { this.life-=dt; this.x+=this.vx*dt; this.y+=this.vy*dt; },
                            draw(ctx) { ctx.globalAlpha = this.life; ctx.fillStyle=this.color; ctx.beginPath(); ctx.arc(this.x,this.y,this.radius,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; },
                            alive() { return this.life>0; }
                        });
                    }
                }
            }

            function spawnHealParticles(x, y) {
                for (let i = 0; i < 6; i++) {
                    particles.push({
                        x: x + (Math.random()-0.5)*20,
                        y: y + (Math.random()-0.5)*20,
                        color: '#2ed573', life: 0.6,
                        vx: (Math.random()-0.5)*60, vy: -35 - Math.random()*35,
                        radius: 3.5,
                        update(dt) { this.life-=dt; this.x+=this.vx*dt; this.y+=this.vy*dt; },
                        draw(ctx) { ctx.globalAlpha=this.life*1.6; ctx.fillStyle=this.color; ctx.beginPath(); ctx.arc(this.x,this.y,this.radius,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; },
                        alive() { return this.life>0; }
                    });
                }
            }

            // ==================== INICIALIZACIÓN DE NIVELES ====================
            function syncUnlocksForLevel(lvl) {
                if (lvl > 1) paceUnlocked = true;
                if (lvl > 2) healthUnlocked = true;
                if (lvl > 3) maskUnlocked = true;
                if (lvl > 4) inclusiveUnlocked = true;
            }

            function initLevel(lvl) {
                resizeCanvas();
                currentLevel = lvl;
                syncUnlocksForLevel(lvl);
                const cfg = getLevelConfig(lvl);
                citizens = []; policeUnits = []; safeZones = []; particles = []; gasClouds = []; flag = null; boss = null;
                mobilization = { active:false, timer:0, outcomeState:null, isFinal:false };
                floatingMessages = [];
                comboStreak = 0; comboMultiplier = 1;
                inclusiveCooldown = 0;
                bossWave = { active:false, timer:0, pending:0 };
                
                const focusData = RESISTANCE_FOCUS[lvl];
                resistanceFocus = new SafeZone(W*0.25, H*0.5, 62, true, focusData.name, focusData.message);
                
                player = new Player(resistanceFocus.x, resistanceFocus.y);
                brigadista = healthUnlocked ? new HealthBrigadista(resistanceFocus.x + 30, resistanceFocus.y + 30) : null;

                for (let i=0; i<cfg.citizens; i++) {
                    citizens.push(new Citizen(W*0.32+Math.random()*W*0.55, 50+Math.random()*(H-100), cfg.type));
                }
                for (let i=0; i<cfg.police; i++) {
                    policeUnits.push(new PoliceUnit(W*0.6+Math.random()*W*0.3, 50+Math.random()*(H-100), cfg.policeSpeed));
                }
                gameState = STATE.PLAYING;
                cameraShake = 0;
            }

            function initBossLevel() {
                resizeCanvas();
                currentLevel = BOSS_LEVEL_NUM;
                syncUnlocksForLevel(BOSS_LEVEL_NUM);
                const cfg = { citizens:22, police:3, policeSpeed:1.6, citizenSpeed:1.4, required:15, type:'mixto' };
                citizens = []; policeUnits = []; safeZones = []; particles = []; gasClouds = []; flag = null;
                mobilization = { active:false, timer:0, outcomeState:null, isFinal:false };
                floatingMessages = [];
                comboStreak = 0; comboMultiplier = 1;
                inclusiveCooldown = 0;
                bossCitizensCaught = 0;
                bossWavesFired = 0;
                bossWave = { active:false, timer:0, pending:0 };
                bossSpawnTimer = 3.0;
                boss = new Boss(W*0.75, H*0.5);
                
                const bossFocus = RESISTANCE_FOCUS[BOSS_LEVEL_NUM];
                resistanceFocus = new SafeZone(W*0.25, H*0.5, 62, true, bossFocus.name, bossFocus.message);
                
                player = new Player(resistanceFocus.x, resistanceFocus.y);
                brigadista = healthUnlocked ? new HealthBrigadista(resistanceFocus.x + 30, resistanceFocus.y + 30) : null;
                
                const allTypes = ['jubilado','discapacitado','cientifico','feminista','universitario'];
                for (let i=0; i<cfg.citizens; i++) {
                    citizens.push(new Citizen(W*0.2+Math.random()*W*0.5, 45+Math.random()*(H-90), allTypes[Math.floor(Math.random()*allTypes.length)]));
                }
                for (let i=0; i<cfg.police; i++) policeUnits.push(new PoliceUnit(W*0.7+i*60, H*0.4+i*60, cfg.policeSpeed));
                
                const prevLevels = [1,2,3,4,5];
                const positions = [
                    {x:W*0.7, y:H*0.22}, {x:W*0.7, y:H*0.52}, {x:W*0.7, y:H*0.82},
                    {x:W*0.45, y:H*0.82}, {x:W*0.15, y:H*0.82}
                ];
                prevLevels.forEach((lvl, i) => {
                    const fd = RESISTANCE_FOCUS[lvl];
                    if (fd) {
                        const pos = positions[i] || {x:W*0.5, y:H*0.5};
                        safeZones.push(new SafeZone(pos.x, pos.y, 42, true, fd.name, '')); 
                    }
                });
                gameState = STATE.BOSS_INTRO;
                bossIntroTimer = 0;
                cameraShake = 0;
            }

            // ==================== ACTUALIZACIÓN DEL HUD ====================
            function updateHUD(cfg) {
                const titlePrefix = currentLevel <= MAX_REGULAR_LEVELS ? `Nv.${currentLevel} · ` : `FINAL · `;
                hudLevelTitle.textContent = titlePrefix + (LEVEL_TITLES[currentLevel] || `Nivel ${currentLevel}`);

                let req, current;
                if (currentLevel <= MAX_REGULAR_LEVELS) {
                    req = cfg ? cfg.required : 1;
                    current = player ? player.getStrength() : 0;
                } else {
                    const idx = Math.min(bossWavesFired, BOSS_WAVES_AT.length - 1);
                    req = BOSS_WAVES_AT[idx];
                    current = Math.min(bossCitizensCaught, req);
                }

                if (flag) {
                    hudOrgCounter.textContent = `🚩 ¡BANDERA LISTA! (${current}/${req})`;
                    hudProgress.classList.add('ready');
                } else {
                    hudOrgCounter.textContent = `👥 ${current} / ${req}`;
                    hudProgress.classList.remove('ready');
                }
                hudProgress.style.width = Math.min(100, (current/req)*100) + '%';
                
                hudTimer.textContent = formatTime(totalTime);
                hudLives.textContent = '❤'.repeat(Math.max(0, lives)) || '💔';
                hudCombo.textContent = '×' + comboMultiplier;
                hudComboPanel.classList.toggle('combo-active', comboMultiplier > 1);

                // Actualizar Badges de Conquistas / Poderes
                powerPaceBadge.classList.toggle('unlocked', paceUnlocked);
                statusPace.textContent = paceUnlocked ? 'ACTIVA' : (currentLevel === 1 ? 'NV.1' : '🔒');

                powerHealthBadge.classList.toggle('unlocked', healthUnlocked);
                statusHealth.textContent = healthUnlocked ? 'ACTIVA' : '🔒';

                powerMaskBadge.classList.toggle('unlocked', maskUnlocked);
                statusMask.textContent = maskUnlocked ? 'ACTIVA' : '🔒';

                powerInclusiveBadge.classList.toggle('unlocked', inclusiveUnlocked);
                powerInclusiveBadge.classList.toggle('on-cooldown', inclusiveUnlocked && inclusiveCooldown > 0);
                statusInclusive.textContent = !inclusiveUnlocked ? '🔒' : (inclusiveCooldown > 0 ? inclusiveCooldown.toFixed(1)+'s' : 'LISTO');
            }

            // ==================== INTERACCIONES Y COLISIONES ====================
            function playerCollect() {
                for (let i = citizens.length - 1; i >= 0; i--) {
                    const c = citizens[i];
                    if (c.collected || c.pickupLock > 0) continue;
                    if (devConfig.edgeMode === 'clasico' && c.scatter > 0) continue;

                    if (Math.hypot(player.x-c.x, player.y-c.y) < player.radius+c.radius) {
                        player.addCitizen(c);
                        citizens.splice(i, 1);
                        comboStreak++;
                        if (comboStreak % 5 === 0 && comboMultiplier < 4) {
                            comboMultiplier++;
                            if (comboMultiplier > maxComboReached) maxComboReached = comboMultiplier;
                            floatingMessages.push({ text:'¡COMBO ×'+comboMultiplier+'!', life:1.3, color:'#ff3838', x:player.x, y:player.y-44, small:true });
                        }
                        
                        if (gameState === STATE.BOSS_BATTLE) {
                            bossCitizensCaught++;
                            if (bossWavesFired < BOSS_WAVES_AT.length && bossCitizensCaught >= BOSS_WAVES_AT[bossWavesFired]) {
                                bossWavesFired++;
                                triggerBossWave();
                            }
                        }
                        break;
                    }
                }
            }

            function policeCapture() {
                for (let p of policeUnits) {
                    if (p.stunTimer>0) continue;
                    for (let c of citizens) {
                        if (c.collected || c.scatter>0) continue;
                        if (Math.hypot(p.x-c.x, p.y-c.y) < p.radius+c.radius) {
                            if (devConfig.edgeMode === 'clasico') {
                                c.scatter = 2;
                            } else {
                                c.scatter = 0.6;
                                c.wanderAngle = Math.atan2(c.y - p.y, c.x - p.x) + (Math.random()-0.5)*0.5;
                            }
                        }
                    }
                    const contact = Math.hypot(p.x-player.x, p.y-player.y) < p.radius+player.radius+8;
                    if (!contact) continue;
                    
                    if (player.getStrength()>0) {
                        if (player.shield) { 
                            p.stun(1.5); 
                            cameraShake = 5;
                            for(let i=0; i<8; i++) {
                                particles.push({
                                    x: p.x, y: p.y,
                                    color: '#2ed573', life: 0.4,
                                    vx: (Math.random()-0.5)*150, vy: (Math.random()-0.5)*150,
                                    radius: 3,
                                    update(dt) { this.life-=dt; this.x+=this.vx*dt; this.y+=this.vy*dt; },
                                    draw(ctx) { ctx.globalAlpha = this.life*2; ctx.fillStyle=this.color; ctx.beginPath(); ctx.arc(this.x,this.y,this.radius,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; },
                                    alive() { return this.life>0; }
                                });
                            }
                        }
                        else if (player.invuln<=0) { player.loseCitizens(Math.min(3, player.getStrength())); resetCombo(); }
                    } else {
                        if (player.invuln<=0) {
                            lives--;
                            player.invuln = 2.0;
                            cameraShake = 18;
                            sfxBattle();
                            floatingMessages.push({ text:'¡DETENIDX! −1 ❤', life:1.6, color:'#ff6b81', x:player.x, y:player.y-44 });
                            if (lives <= 0) setGameOver();
                        }
                    }
                }
            }

            function bossCapture() {
                if (!boss || gameState !== STATE.BOSS_BATTLE) return;
                if (boss.stunTimer > 0) return;

                const contact = Math.hypot(boss.x - player.x, boss.y - player.y) < boss.radius + player.radius + 10;
                if (!contact) return;

                if (player.shield) {
                    boss.stunTimer = Math.max(boss.stunTimer, 1.2);
                    player.shield = false; player.shieldTimer = 0;
                    cameraShake = 12;
                    playBeep(300, 0.2, 'square', 0.1);
                    floatingMessages.push({ text:'¡ESCUDO POPULAR!', life:1.4, color:'#2ed573', x:boss.x, y:boss.y - boss.radius - 20 });
                    return;
                }

                if (player.invuln > 0) return;

                if (player.getStrength() > 0) {
                    player.loseCitizens(Math.min(3, player.getStrength()));
                    resetCombo();
                    floatingMessages.push({ text:'¡TE DESORGANIZÓ!', life:1.2, color:'#ff6b81', x:player.x, y:player.y-40, small:true });
                } else {
                    lives--;
                    player.invuln = 2.0;
                    cameraShake = 18;
                    sfxBattle();
                    floatingMessages.push({ text:'¡DETENIDX! −1 ❤', life:1.6, color:'#ff6b81', x:player.x, y:player.y-44 });
                    if (lives <= 0) setGameOver();
                }
            }

            function resetCombo() {
                comboStreak = 0;
                if (comboMultiplier > 1) {
                    floatingMessages.push({ text:'Combo perdido', life:1.0, color:'#ff6b81', x:player.x, y:player.y-40, small:true });
                }
                comboMultiplier = 1;
            }

            function checkNearMiss() {
                for (let p of policeUnits) {
                    if (p.stunTimer > 0) continue;
                    const d = Math.hypot(player.x-p.x, player.y-p.y);
                    const hitDist = player.radius + p.radius + 8;
                    if (d > hitDist && d < hitDist + 28 && p.nearMissCd <= 0) {
                        p.nearMissCd = 1.5;
                        playBeep(1400, 0.07, 'sine', 0.06);
                        floatingMessages.push({ text:'¡Cerca!', life:0.9, color:'#7bed9f', x:player.x, y:player.y-34, small:true });
                    }
                }
            }

            function healCollectedInPosta() {
                if (!player) return;
                let healedCount = 0;
                if (player.inGas && player.gasImmunity <= 0) {
                    player.gasImmunity = 3.5;
                    healedCount++;
                }
                for (let c of player.collected) {
                    if (c.gassed > 0) {
                        c.gassed = 0;
                        c.gasImmunity = 4.0;
                        healedCount++;
                    }
                }
                if (healedCount > 0) {
                    sfxHeal();
                    spawnHealParticles(player.x, player.y);
                    floatingMessages.push({
                        text: `🏥 ¡Posta Sanitaria curó a la columna!`,
                        life: 1.5, color: '#2ed573',
                        x: player.x, y: player.y - 45, small: true
                    });
                }
            }

            function safeZoneProtect() {
                if (resistanceFocus && resistanceFocus.active) {
                    const insideMain = resistanceFocus.contains(player.x, player.y, player.radius);
                    if (insideMain && !resistanceFocus.messageShown) {
                        floatingMessages.push({
                            text: resistanceFocus.message, life: 9999, color: '#2ed573',
                            x: W/2, y: H/2 - 60, id: 'resistance'
                        });
                        resistanceFocus.messageShown = true;
                    } else if (!insideMain && resistanceFocus.messageShown) {
                        resistanceFocus.messageShown = false;
                        floatingMessages = floatingMessages.filter(m => m.id !== 'resistance');
                    }
                    if (insideMain) {
                        player.invuln = Math.max(player.invuln, 0.4);
                        if (devConfig.healMode === 'ambos' || devConfig.healMode === 'posta') healCollectedInPosta();
                        for (let p of policeUnits) if (resistanceFocus.contains(p.x,p.y,p.radius)) p.stun(0.5);
                    }
                }
                for (let sz of safeZones) {
                    if (!sz.active) continue;
                    if (sz.contains(player.x, player.y, player.radius)) {
                        player.invuln = Math.max(player.invuln, 0.3);
                        if (devConfig.healMode === 'ambos' || devConfig.healMode === 'posta') healCollectedInPosta();
                        for (let p of policeUnits) if (sz.contains(p.x,p.y,p.radius)) p.stun(0.5);
                    }
                }
                if (boss && gameState === STATE.BOSS_BATTLE) {
                    if (resistanceFocus.contains(player.x, player.y, player.radius) && !resistanceFocus._bossTaunted) {
                        resistanceFocus._bossTaunted = true;
                        floatingMessages.push({
                            text: 'Esa zona no te sirve contra mí 😏',
                            life: 2.5, color: '#ff6b81',
                            x: boss.x, y: boss.y - boss.radius - 25, small: true
                        });
                        setTimeout(() => { if (resistanceFocus) resistanceFocus._bossTaunted = false; }, 6000);
                    }
                }
            }

            function checkFlagSpawn(required) {
                if (flag || mobilization.active) return;
                if (player.getStrength() >= required) {
                    flag = new Flag(Math.random()<0.5?75:W-75, H*0.28+Math.random()*H*0.44);
                    sfxFlagSpawn();
                    
                    floatingMessages.push({
                        text: FLAG_MESSAGES[currentLevel] || "¡LA BANDERA HA APARECIDO!", 
                        life: 4, color: '#ff3838',
                        x: W/2, y: H/4, id: 'flag_spawn'
                    });
                }
            }

            function checkFlagCollection() {
                if (!flag || mobilization.active) return false;
                if (Math.hypot(player.x-flag.poleX, player.y-(flag.poleY+25)) < 44) {
                    mobilization.active = true;
                    mobilization.timer = 3.0;
                    mobilization.isFinal = true;
                    flag = null;
                    gasClouds = [];
                    sfxMobilization();
                    mobilization.outcomeState = STATE.LEVEL_COMPLETE;
                    cameraShake = 20;
                    return true;
                }
                return false;
            }

            function spawnTideParticle() {
                const colors = ['#ff3838','#ff6b6b','#ffffff'];
                particles.push({
                    x: -50, y: Math.random()*H,
                    color: colors[Math.floor(Math.random()*3)], life: 3,
                    vx: 400+Math.random()*300, vy: (Math.random()-0.5)*80,
                    radius: 8 + Math.random()*6, isTide: true,
                    update(dt) { this.life-=dt; this.x+=this.vx*dt; this.y+=this.vy*dt; },
                    draw(ctx) {
                        ctx.globalAlpha = Math.min(1, this.life);
                        ctx.fillStyle = this.color;
                        ctx.beginPath(); ctx.arc(this.x,this.y,this.radius,0,Math.PI*2); ctx.fill();
                        ctx.globalAlpha = 1;
                    },
                    alive() { return this.life>0; }
                });
            }

            // ==================== PODERES ACTIVOS (E) ====================
            function triggerBossWave() {
                if (bossWave.active) {
                    bossWave.pending++;
                    return;
                }
                bossWave.active = true;
                bossWave.timer = 2.4;
                sfxMobilization();
                cameraShake = 22;
                floatingMessages.push({
                    text: '¡OLA POPULAR!', life: 2.5, color: '#ff3838',
                    x: W/2, y: H*0.28, id: 'wave_msg'
                });
            }

            // Poder Nivel 4: Lenguaje Inclusivo (Tecla E)
            function useInclusiveAbility() {
                if (!inclusiveUnlocked) return;
                if (inclusiveCooldown > 0) return;
                if (gameState !== STATE.PLAYING && gameState !== STATE.BOSS_BATTLE) return;
                if (!player) return;
                
                inclusiveCooldown = 5.0;
                inclusiveFlash = 1.0;
                inclusiveFlashX = player.x;
                inclusiveFlashY = player.y;
                cameraShake = 14;
                sfxInclusive();
                
                for (let p of policeUnits) {
                    p.stun(2.8);
                    for (let i=0;i<4;i++) {
                        particles.push({
                            x: p.x, y: p.y,
                            color: '#a29bfe', life: 0.6,
                            vx: (Math.random()-0.5)*120, vy: (Math.random()-0.5)*120,
                            radius: 3,
                            update(dt) { this.life-=dt; this.x+=this.vx*dt; this.y+=this.vy*dt; },
                            draw(ctx) { ctx.globalAlpha=this.life*1.5; ctx.fillStyle=this.color; ctx.beginPath(); ctx.arc(this.x,this.y,this.radius,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; },
                            alive() { return this.life>0; }
                        });
                    }
                }
                
                floatingMessages.push({
                    text: '¡Vamos les pibis!',
                    life: 1.6, color: '#a29bfe',
                    x: player.x, y: player.y - 50, id: 'inclusive_msg'
                });

            // ==================== RENDERIZADO ====================
            function drawBossTaunt(c2) {
                c2.font = `bold ${Math.min(15, Math.max(11, W/55))}px "Inter", sans-serif`;
                const tw = c2.measureText(bossTauntText).width;
                const bx = boss.x, by = boss.y - boss.radius - 48;
                c2.fillStyle = 'rgba(255,255,255,0.92)';
                c2.beginPath(); c2.roundRect(bx - tw/2 - 12, by - 14, tw + 24, 28, 8); c2.fill();
                c2.beginPath(); c2.moveTo(bx - 6, by + 13); c2.lineTo(bx + 8, by + 13); c2.lineTo(bx + 2, by + 24); c2.closePath(); c2.fill();
                c2.fillStyle = '#111'; c2.textAlign = 'center'; c2.textBaseline = 'middle';
                c2.fillText(bossTauntText, bx, by + 1);
                c2.textBaseline = 'alphabetic';
            }

            function drawWorld() {
                if (!W || !H) return;
                ctx.clearRect(0, 0, W, H);
                
                ctx.save();
                if (cameraShake > 0) {
                    const sx = (Math.random()-0.5)*cameraShake;
                    const sy = (Math.random()-0.5)*cameraShake;
                    ctx.translate(sx, sy);
                }

                if (resistanceFocus && resistanceFocus.active) resistanceFocus.draw(ctx);
                safeZones.forEach(s=>s.active&&s.draw(ctx));
                gasClouds.forEach(g=>g.draw(ctx));
                
                citizens.forEach(c=>!c.collected&&c.draw(ctx));
                if (player) player.collected.forEach(c=>c.drawCollected(ctx, c.x, c.y));
                if (brigadista && healthUnlocked) brigadista.draw(ctx);
                
                policeUnits.forEach(p=>p.draw(ctx));
                if (player) player.draw(ctx);
                if (boss && (gameState===STATE.BOSS_BATTLE||gameState===STATE.BOSS_INTRO)) boss.draw(ctx);
                if (bossTauntText && gameState===STATE.BOSS_BATTLE && bossTauntTimer > 2 && boss) drawBossTaunt(ctx);
                if (flag) flag.draw(ctx);
                
                particles.forEach(p=>p.draw(ctx));

                if (inclusiveFlash > 0) {
                    const r = (1 - inclusiveFlash) * 650;
                    ctx.beginPath();
                    ctx.arc(inclusiveFlashX, inclusiveFlashY, r, 0, Math.PI*2);
                    ctx.strokeStyle = `rgba(162, 155, 254, ${Math.max(0, inclusiveFlash)})`;
                    ctx.lineWidth = 8;
                    ctx.stroke();
                }
                
                ctx.restore();

                floatingMessages.forEach(m=>{
                    if (m.small) {
                        ctx.font = `bold ${Math.min(14, Math.max(10, W/60))}px "Inter", sans-serif`;
                    } else if (m.id === 'flag_spawn') {
                        ctx.font = `bold ${Math.min(18, Math.max(12, W/45))}px "Press Start 2P", cursive`;
                    } else {
                        ctx.font = `bold ${Math.min(20, Math.max(14, W/35))}px "Inter", sans-serif`;
                    }
                    ctx.textAlign = 'center';
                    
                    const lines = m.text.split('\n');
                    const lineHeight = m.id === 'flag_spawn' ? Math.min(24, Math.max(16, W/35)) : Math.min(26, Math.max(18, W/30));
                    
                    lines.forEach((line, i) => {
                        const ly = m.y + (i - (lines.length-1)/2)*lineHeight;
                        ctx.fillStyle = '#000';
                        ctx.fillText(line, m.x+2, ly+2);
                        ctx.fillStyle = m.color;
                        ctx.fillText(line, m.x, ly);
                    });
                });
            }

            function drawOverlay(title, subtitle, actionText, bgAlpha = 0.84) {
                ctx.fillStyle = `rgba(20, 20, 36, ${bgAlpha})`; 
                ctx.fillRect(0,0,W,H);
                
                ctx.fillStyle = '#ff3838'; 
                let titleSize = Math.min(26, W / 26);
                ctx.font = `bold ${titleSize}px "Press Start 2P", cursive`; 
                ctx.textAlign = 'center';
                ctx.shadowColor = '#000'; ctx.shadowBlur = 8;
                
                if (title === 'UNIDAD CONTRA EL PRESIDENTE') {
                     ctx.fillText('UNIDAD CONTRA EL', W/2, H*0.33 - titleSize/2 - 5);
                     ctx.fillText('PRESIDENTE', W/2, H*0.33 + titleSize/2 + 5);
                     
                     ctx.fillStyle = '#a0a0a0'; 
                     ctx.font = `${Math.min(12, Math.max(9, W/50))}px "Inter", sans-serif`;
                     ctx.shadowBlur = 0;
                     ctx.fillText('Música: La Internacional (8-bit) por Red & Black Archive (RednBlackArchive)', W/2, H - 22);
                } else if (title === 'LA ORGANIZACIÓN FRACASÓ') {
                     ctx.fillText('LA ORGANIZACIÓN', W/2, H*0.33 - titleSize/2 - 5);
                     ctx.fillText('FRACASÓ', W/2, H*0.33 + titleSize/2 + 5);
                } else {
                     ctx.fillText(title, W/2, H*0.33);
                }
                
                if (subtitle) {
                    ctx.fillStyle = '#e0e0e0'; 
                    ctx.font = `${Math.min(18, Math.max(12, W/40))}px "Inter", sans-serif`;
                    ctx.shadowBlur = 4;
                    const lines = subtitle.split('\n');
                    lines.forEach((line, i) => {
                        ctx.fillText(line, W/2, H*0.52 + i * Math.min(25, W/35));
                    });
                }
                
                ctx.fillStyle = '#ff3838'; 
                ctx.font = `bold ${Math.min(16, Math.max(10, W/45))}px "Press Start 2P", cursive`;
                ctx.globalAlpha = 0.5 + Math.abs(Math.sin(Date.now()*0.003))*0.5;
                ctx.fillText(actionText, W/2, H*0.82);
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
            }

            function drawAbilityUnlockOverlay(lvl) {
                const info = UNLOCK_INFO[lvl];
                if (!info) return;
                ctx.fillStyle = 'rgba(18, 18, 32, 0.94)';
                ctx.fillRect(0, 0, W, H);
                
                ctx.font = `${Math.min(44, W/18)}px "Segoe UI Emoji", sans-serif`;
                ctx.textAlign = 'center';
                ctx.fillText(info.icon, W/2, H*0.16);

                let titleSize = Math.min(21, W / 32);
                ctx.fillStyle = info.color;
                ctx.font = `bold ${titleSize}px "Press Start 2P", cursive`;
                ctx.shadowColor = '#000'; ctx.shadowBlur = 8;
                ctx.fillText(info.title1, W/2, H*0.26);
                ctx.fillText(info.title2, W/2, H*0.26 + titleSize + 10);
                
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#e0e0e0';
                ctx.font = `${Math.min(16, Math.max(12, W/44))}px "Inter", sans-serif`;
                info.lines.forEach((line, i) => {
                    ctx.fillText(line, W/2, H*0.42 + i * Math.min(24, W/36));
                });
                
                ctx.fillStyle = info.color;
                ctx.font = `bold ${Math.min(13, Math.max(9, W/55))}px "Inter", sans-serif`;
                ctx.fillText(info.sub, W/2, H*0.76);
                
                ctx.fillStyle = '#ff3838';
                ctx.font = `bold ${Math.min(15, Math.max(10, W/45))}px "Press Start 2P", cursive`;
                ctx.globalAlpha = 0.5 + Math.abs(Math.sin(Date.now()*0.003))*0.5;
                ctx.fillText('CLIC O ENTER PARA CONTINUAR', W/2, H*0.89);
                ctx.globalAlpha = 1;
            }

            // ==================== MODAL DE VIDEO ENTRE NIVELES ====================
            function showLevelVideoModal(lvl, onContinue) {
                const vData = LEVEL_VIDEOS[lvl];
                if (!devConfig.videosEnabled || !vData) {
                    onContinue();
                    return;
                }
                const bgm = document.getElementById('bgm');

                modal.innerHTML = `
                    <h2>🎬 ${escapeHtml(LEVEL_TITLES[lvl])}</h2>
                    <p>${escapeHtml(vData.caption)}</p>
                    <div class="video-box">
                        <video id="cutscene-video" src="${escapeHtml(vData.src)}" controls autoplay playsinline></video>
                    </div>
                    <button id="skip-video-btn">CONTINUAR / SALTAR VIDEO ⏭️</button>
                `;

                    onContinue();

                if (vid) {
                    vid.onended = finish;
                    vid.onerror = finish;

            // ==================== MODAL VICTORIA / RANKING ====================
            function showVictoryModal() {
                modal.classList.add('active');
                modal.innerHTML = `
                    <h2>¡VICTORIA TOTAL!</h2>

                    modal.classList.remove('active');
