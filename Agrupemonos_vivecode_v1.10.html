                }
            }



            function checkNearMiss() {
                for (let p of policeUnits) {
                    if (p.stunTimer > 0) continue;
                    const d = Math.hypot(player.x - p.x, player.y - p.y);
                    const hitDist = player.radius + p.radius + 8;
                    if (d > hitDist && d < hitDist + 28 && p.nearMissCd <= 0) {
                        p.nearMissCd = 1.5;
                        playBeep(1400, 0.07, 'sine', 0.06);
                        floatingMessages.push({ text: '¡Cerca!', life: 0.9, color: '#7bed9f', x: player.x, y: player.y - 34, small: true });
                    }
                }
            }

            function safeZoneProtect() {
                if (resistanceFocus && resistanceFocus.active) {
                    const insideMain = resistanceFocus.contains(player.x, player.y, player.radius);
                    if (insideMain && !resistanceFocus.messageShown) {
                        floatingMessages.push({
                            text: resistanceFocus.message, life: 9999, color: '#2ed573',
                            x: W / 2, y: H / 2 - 60, id: 'resistance'
                        });
                        resistanceFocus.messageShown = true;
                    } else if (!insideMain && resistanceFocus.messageShown) {
                        resistanceFocus.messageShown = false;
                        floatingMessages = floatingMessages.filter(m => m.id !== 'resistance');
                    }
                    if (insideMain) {
                        player.invuln = Math.max(player.invuln, 0.4);
                        for (let p of policeUnits) if (resistanceFocus.contains(p.x, p.y, p.radius)) p.stun(0.5);
                    }
                }
                for (let sz of safeZones) {
                    if (!sz.active) continue;
                    if (sz.contains(player.x, player.y, player.radius)) {
                        player.invuln = Math.max(player.invuln, 0.3);
                        for (let p of policeUnits) if (sz.contains(p.x, p.y, p.radius)) p.stun(0.5);
                    }
                }
                if (boss && gameState === STATE.BOSS_BATTLE) {
                    if (resistanceFocus.contains(player.x, player.y, player.radius) && !resistanceFocus._bossTaunted) {
                        resistanceFocus._bossTaunted = true;
                        floatingMessages.push({
                            text: 'Esa zona no te sirve contra mí 😏',
                            life: 2.5, color: '#ff6b81',
                            x: boss.x, y: boss.y - boss.radius - 25, small: true
                        });
                        setTimeout(() => { if (resistanceFocus) resistanceFocus._bossTaunted = false; }, 6000);
                    }
                }
            }

            function checkFlagSpawn(required) {
                if (flag || mobilization.active) return;
                if (player.getStrength() >= required) {
                    flag = new Flag(Math.random() < 0.5 ? 75 : W - 75, H * 0.28 + Math.random() * H * 0.44);
                    sfxFlagSpawn();
                    floatingMessages.push({
                        text: FLAG_MESSAGES[currentLevel] || "¡LA BANDERA HA APARECIDO!",
                        life: 4, color: '#ff3838',
                        x: W / 2, y: H / 4, id: 'flag_spawn'
                    });
                }
            }

            function checkFlagCollection() {
                if (!flag || mobilization.active) return false;
                if (Math.hypot(player.x - flag.poleX, player.y - (flag.poleY + 25)) < 44) {
                    if (currentLevel <= MAX_REGULAR_LEVELS) {
                        const curCfg = getLevelConfig(currentLevel);
                        const req2 = Math.ceil(curCfg.required * 1.10);
                        const req3 = Math.ceil(curCfg.required * 1.20);
                        let earned = 1;
                        if (player.getStrength() >= req3) earned = 3;
                        else if (player.getStrength() >= req2) earned = 2;
                        levelStars[currentLevel] = Math.max(levelStars[currentLevel] || 0, earned);
                        totalStarsEarned = Object.values(levelStars).reduce((a, b) => a + b, 0);
                        lastEarnedStars = earned;
                    }
                    mobilization.active = true;
                    mobilization.timer = 3.0;
                    mobilization.isFinal = true;
                    flag = null;
                    gasClouds = [];
                    sfxMobilization();
                    mobilization.outcomeState = STATE.LEVEL_COMPLETE;
                    cameraShake = 20;
                    return true;
                }
                return false;
            }

            function spawnTideParticle() {
                const colors = ['#ff3838', '#ff6b6b', '#ffffff'];
                particles.push({
                    x: -50, y: Math.random() * H,
                    color: colors[Math.floor(Math.random() * 3)], life: 3,
                    vx: 400 + Math.random() * 300, vy: (Math.random() - 0.5) * 80,
                    radius: 8 + Math.random() * 6, isTide: true,
                    update(dt) { this.life -= dt; this.x += this.vx * dt; this.y += this.vy * dt; },
                    draw(ctx) {
                        ctx.globalAlpha = Math.min(1, this.life);
                        ctx.fillStyle = this.color;
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.globalAlpha = 1;
                    },
                    alive() { return this.life > 0; }
                });
            }

            function drawBossTaunt(c2) {
                c2.font = `bold ${Math.min(15, Math.max(11, W / 55))}px "Inter", sans-serif`;
                const tw = c2.measureText(bossTauntText).width;
                const bx = boss.x, by = boss.y - boss.radius - 48;

                c2.beginPath(); c2.roundRect(bx - tw / 2 - 12, by - 14, tw + 24, 28, 8); c2.fill();
                c2.beginPath(); c2.moveTo(bx - 6, by + 13); c2.lineTo(bx + 8, by + 13); c2.lineTo(bx + 2, by + 24); c2.closePath(); c2.fill();
                c2.fillStyle = '#111'; c2.textAlign = 'center'; c2.textBaseline = 'middle';
                c2.fillText(bossTauntText, bx, by + 1);
                c2.textBaseline = 'alphabetic';
            }

            function drawWorld() {
                if (!W || !H) return;
                ctx.clearRect(0, 0, W, H);

                ctx.save();
                if (cameraShake > 0) {
                    ctx.translate((Math.random() - 0.5) * cameraShake, (Math.random() - 0.5) * cameraShake);
                }

                if (resistanceFocus && resistanceFocus.active) resistanceFocus.draw(ctx);
                safeZones.forEach(s => s.active && s.draw(ctx));
                gasClouds.forEach(g => g.draw(ctx));

                assemblies.forEach(a => a.draw(ctx));
                citizens.forEach(c => !c.collected && c.draw(ctx));
                if (player) player.collected.forEach(c => c.drawCollected(ctx, c.x, c.y));
                if (brigadista && healthUnlocked) brigadista.draw(ctx);

                bureaucrats.forEach(b => b.draw(ctx));
                policeUnits.forEach(p => p.draw(ctx));
                if (player) player.draw(ctx);
                if (boss && (gameState === STATE.BOSS_BATTLE || gameState === STATE.BOSS_INTRO)) boss.draw(ctx);
                if (bossTauntText && gameState === STATE.BOSS_BATTLE && bossTauntTimer > 2 && boss) drawBossTaunt(ctx);
                if (flag) flag.draw(ctx);

                particles.forEach(p => p.draw(ctx));

                if (inclusiveFlash > 0) {
                    const r = (1 - inclusiveFlash) * 650;
                    ctx.beginPath();
                    ctx.arc(inclusiveFlashX, inclusiveFlashY, r, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(162, 155, 254, ${Math.max(0, inclusiveFlash)})`;
                    ctx.lineWidth = 8;
                    ctx.stroke();
                }

                ctx.restore();

                floatingMessages.forEach(m => {
                    if (m.id === 'wave_msg') {
                        const lines = m.text.split('\n');
                        const boxW = Math.min(W * 0.92, 660);
                        const boxH = Math.min(125, H * 0.22);
                        const bx = W / 2 - boxW / 2;
                        const by = m.y - boxH / 2;

                        ctx.save();
                        ctx.fillStyle = 'rgba(15, 15, 28, 0.94)';
                        ctx.strokeStyle = '#ff3838';
                        ctx.lineWidth = 3;
                        ctx.shadowColor = '#ff3838';
                        ctx.shadowBlur = 14;
                        ctx.beginPath();
                        ctx.roundRect(bx, by, boxW, boxH, 10);
                        ctx.fill();
                        ctx.stroke();
                        ctx.shadowBlur = 0;

                        // Línea 1: Título del pilar derribado
                        ctx.font = `bold ${Math.min(18, Math.max(11, W / 44))}px "Press Start 2P", cursive`;
                        ctx.fillStyle = '#ffd32a';
                        ctx.textAlign = 'center';
                        ctx.fillText(lines[0] || '', W / 2, by + boxH * 0.32);

                        // Línea 2: Explicación política del pilar
                        ctx.font = `bold ${Math.min(15, Math.max(11, W / 50))}px "Inter", sans-serif`;
                        ctx.fillStyle = '#ffffff';
                        ctx.fillText(lines[1] || '', W / 2, by + boxH * 0.62);

                        // Línea 3: Requisito de la columna popular
                        if (lines[2]) {
                            ctx.font = `${Math.min(13, Math.max(9, W / 56))}px "Inter", sans-serif`;
                            ctx.fillStyle = '#ff6b81';
                            ctx.fillText(lines[2], W / 2, by + boxH * 0.85);
                        }
                        ctx.restore();
                        return;
                    }

                    if (m.small) {
                        ctx.font = `bold ${Math.min(14, Math.max(10, W / 60))}px "Inter", sans-serif`;
                    } else if (m.id === 'flag_spawn') {
                        ctx.font = `bold ${Math.min(18, Math.max(12, W / 45))}px "Press Start 2P", cursive`;
                    } else {
                        ctx.font = `bold ${Math.min(20, Math.max(14, W / 35))}px "Inter", sans-serif`;
                    }
                    ctx.textAlign = 'center';

                    const lines = m.text.split('\n');
                    const lineHeight = m.id === 'flag_spawn' ? Math.min(24, Math.max(16, W / 35)) : Math.min(26, Math.max(18, W / 30));

                    lines.forEach((line, i) => {
                        const ly = m.y + (i - (lines.length - 1) / 2) * lineHeight;
                        ctx.fillStyle = '#000';
                        ctx.fillText(line, m.x + 2, ly + 2);
                        ctx.fillStyle = m.color;
                        ctx.fillText(line, m.x, ly);
                    });
                });
            }

            function drawOverlay(title, subtitle, actionText, bgAlpha = 0.84) {
                ctx.fillStyle = `rgba(20, 20, 36, ${bgAlpha})`;
                ctx.fillRect(0, 0, W, H);

                ctx.fillStyle = '#ff3838';
                const titleSize = Math.min(26, W / 26);
                ctx.font = `bold ${titleSize}px "Press Start 2P", cursive`;

                ctx.shadowColor = '#000';
                ctx.shadowBlur = 8;

                if (title === 'UNIDAD CONTRA EL PRESIDENTE') {
                    ctx.fillText('UNIDAD CONTRA EL', W / 2, H * 0.33 - titleSize / 2 - 5);
                    ctx.fillText('PRESIDENTE', W / 2, H * 0.33 + titleSize / 2 + 5);

                    ctx.fillStyle = '#a0a0a0';
                    ctx.font = `${Math.min(12, Math.max(9, W / 50))}px "Inter", sans-serif`;
                    ctx.shadowBlur = 0;
                    ctx.fillText('Música: La Internacional (8-bit) por Red & Black Archive (RednBlackArchive)', W / 2, H - 22);
                } else if (title === 'LA ORGANIZACIÓN FRACASÓ') {
                    ctx.fillText('LA ORGANIZACIÓN', W / 2, H * 0.33 - titleSize / 2 - 5);
                    ctx.fillText('FRACASÓ', W / 2, H * 0.33 + titleSize / 2 + 5);
                } else {
                    ctx.fillText(title, W / 2, H * 0.33);
                }

                if (subtitle) {
                    ctx.fillStyle = '#e0e0e0';
                    ctx.font = `${Math.min(18, Math.max(12, W / 40))}px "Inter", sans-serif`;
                    ctx.shadowBlur = 4;
                    const lines = subtitle.split('\n');
                    lines.forEach((line, i) => {
                        ctx.fillText(line, W / 2, H * 0.52 + i * Math.min(25, W / 35));
                    });
                }

                ctx.fillStyle = '#ff3838';
                ctx.font = `bold ${Math.min(16, Math.max(10, W / 45))}px "Press Start 2P", cursive`;
                ctx.globalAlpha = 0.5 + Math.abs(Math.sin(Date.now() * 0.003)) * 0.5;
                ctx.fillText(actionText, W / 2, H * 0.82);
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
            }

            function drawAbilityUnlockOverlay(lvl) {
                const info = UNLOCK_INFO[lvl];
                if (!info) return;
                ctx.fillStyle = 'rgba(18, 18, 32, 0.94)';
                ctx.fillRect(0, 0, W, H);

                const transImg = assets.transitions && assets.transitions[lvl];
                const hasArt = transImg && transImg.complete && transImg.naturalWidth > 0;
                let titleY = H * 0.26;
                let textStartY = H * 0.42;

                if (hasArt) {
                    const artH = Math.min(H * 0.24, 140);
                    const artW = artH * (transImg.naturalWidth / Math.max(1, transImg.naturalHeight));
                    ctx.save();
                    ctx.imageSmoothingEnabled = false;
                    ctx.strokeStyle = info.color;
                    ctx.lineWidth = 3;
                    ctx.strokeRect(W / 2 - artW / 2 - 3, H * 0.06 - 3, artW + 6, artH + 6);
                    ctx.drawImage(transImg, W / 2 - artW / 2, H * 0.06, artW, artH);
                    ctx.restore();
                    titleY = H * 0.08 + artH + 22;
                    textStartY = titleY + 56;
                } else {
                    ctx.font = `${Math.min(44, W / 18)}px "Segoe UI Emoji", sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.fillText(info.icon, W / 2, H * 0.15);
                }

                const titleSize = Math.min(20, W / 34);
                ctx.fillStyle = info.color;
                ctx.font = `bold ${titleSize}px "Press Start 2P", cursive`;
                ctx.textAlign = 'center';
                ctx.shadowColor = '#000';
                ctx.shadowBlur = 8;
                ctx.fillText(info.title1, W / 2, titleY);
                ctx.fillText(info.title2, W / 2, titleY + titleSize + 10);

                ctx.shadowBlur = 0;
                ctx.fillStyle = '#e0e0e0';
                ctx.font = `${Math.min(16, Math.max(11, W / 45))}px "Inter", sans-serif`;
                info.lines.forEach((line, i) => {
                    ctx.fillText(line, W / 2, textStartY + i * Math.min(23, W / 36));
                });

                ctx.fillStyle = info.color;
                ctx.font = `bold ${Math.min(13, Math.max(9, W / 55))}px "Inter", sans-serif`;
                ctx.fillText(info.sub, W / 2, H * 0.79);

                ctx.fillStyle = '#ff3838';
                ctx.font = `bold ${Math.min(15, Math.max(10, W / 45))}px "Press Start 2P", cursive`;
                ctx.globalAlpha = 0.5 + Math.abs(Math.sin(Date.now() * 0.003)) * 0.5;
                ctx.fillText('CLIC O ENTER PARA CONTINUAR', W / 2, H * 0.90);
                ctx.globalAlpha = 1;
            }

            function proceedAfterLevelComplete() {
                if (UNLOCK_INFO[currentLevel]) {
                    pendingUnlockLevel = currentLevel;
                    if (currentLevel === 1) paceUnlocked = true;
                    if (currentLevel === 2) memoryUnlocked = true;
                    if (currentLevel === 3) healthUnlocked = true;
                    if (currentLevel === 4) inclusiveUnlocked = true;
                    gameState = STATE.ABILITY_UNLOCK;
                } else if (currentLevel < MAX_REGULAR_LEVELS) {
                    initLevel(currentLevel + 1);
                } else {
                    initBossLevel();
                }
            }

            function handleClick() {
                if (modal.classList.contains('active')) return;
                initAudio();
                const bgm = document.getElementById('bgm');
                if (bgm && bgm.paused) {
                    bgm.volume = 0.25;
                    bgm.play().catch(() => {});
                }

                if (gameState === STATE.MENU) {
                    gameState = STATE.TUTORIAL;
                } else if (gameState === STATE.TUTORIAL) {
                    resetFullGame();
                    initLevel(1);
                } else if (gameState === STATE.LEVEL_COMPLETE) {
                    proceedAfterLevelComplete();
                } else if (gameState === STATE.ABILITY_UNLOCK) {
                    if (pendingUnlockLevel < MAX_REGULAR_LEVELS) initLevel(pendingUnlockLevel + 1);
                    else initBossLevel();
                } else if (gameState === STATE.BOSS_INTRO) {
                    gameState = STATE.BOSS_BATTLE;
                    bossIntroTimer = 0;
                } else if (gameState === STATE.GAME_OVER) {
                    resetFullGame();
                }
            }

            canvas.addEventListener('click', handleClick);
            window.addEventListener('keydown', e => {
                if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) return;
                initAudio();
                const k = e.key.toLowerCase();
                keys[k] = true;
                if (k === 'c' && (gameState === STATE.GAME_OVER || gameState === STATE.VICTORY)) shareScore();
                if (k === 'e') useInclusiveAbility();
                if (e.key === ' ' || e.key === 'Enter') handleClick();
            });
            window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
            gameState = STATE.MENU;
            requestAnimationFrame(loop);

            // ==================== BUCLE PRINCIPAL ====================
            let lastTime = performance.now();
            function loop(now) {
                resizeCanvas();
                const dt = Math.min(0.1, (now - lastTime) / 1000);
                lastTime = now;
                const cfg = currentLevel <= MAX_REGULAR_LEVELS ? getLevelConfig(currentLevel) : null;

                if (cameraShake > 0) cameraShake = Math.max(0, cameraShake - dt * 30);
                if (inclusiveFlash > 0) inclusiveFlash = Math.max(0, inclusiveFlash - dt * 1.6);

                if (gameState === STATE.MENU) {
                    drawWorld();
                    drawOverlay('UNIDAD CONTRA EL PRESIDENTE', `Organizá a cada sector del pueblo y resistí.\nRécord: ${highScore} pts`, 'HAZ CLIC PARA EMPEZAR');
                }
                else if (gameState === STATE.TUTORIAL) {
                    drawWorld();
                    ctx.fillStyle = 'rgba(20, 20, 36, 0.92)';
                    ctx.fillRect(0, 0, W, H);
                    const titleSize = Math.min(24, W / 28);
                    ctx.fillStyle = '#ff3838';
                    ctx.font = `bold ${titleSize}px "Press Start 2P", cursive`;
                    ctx.textAlign = 'center';
                    ctx.fillText('CÓMO ORGANIZARSE', W / 2, H * 0.14);

                    ctx.fillStyle = '#e0e0e0';
                    ctx.font = `${Math.min(16, Math.max(12, W / 48))}px "Inter", sans-serif`;
                    const lines = [
                        '📢 VOS: Sos quien convoca. Acercate a los compañeros para sumarlos a la columna.',
                        '⚠️ CUIDÁ AL GRUPO: Caminá al ritmo del grupo para que nadie quede atrás.',
                        '👮 REPRESIÓN: Esquivá a los policías y las nubes de gas lacrimógeno.',
                        '🧑‍🏭 BURÓCRATA SINDICAL: Fondo azul, pacta con el poder y desmoviliza.',
                        '✊ PUÑOS EN ALTO: Juntá +10% y +20% de compañeros para sumar hasta 3 puños por nivel.',
                        '🚩 BANDERA ROJA: Aparece al alcanzar la meta y desata la movilización popular.',
                        '',
                        'Controles: W A S D o Flechas del teclado'
                    ];
                    lines.forEach((line, i) => ctx.fillText(line, W / 2, H * 0.28 + i * Math.min(32, W / 32)));

                    ctx.fillStyle = '#ff3838';
                    ctx.font = `bold ${Math.min(15, Math.max(10, W / 45))}px "Press Start 2P", cursive`;
                    ctx.globalAlpha = 0.5 + Math.abs(Math.sin(Date.now() * 0.003)) * 0.5;
                    ctx.fillText('HAZ CLIC PARA JUGAR', W / 2, H * 0.88);
                    ctx.globalAlpha = 1;
                }
                else if (gameState === STATE.PLAYING || gameState === STATE.BOSS_BATTLE) {
                    player.update(dt);
                    if (brigadista && healthUnlocked) brigadista.update(dt);
                    updateAssemblies(dt);
                    citizens.forEach(c => c.update(dt, cfg || getLevelConfig(5)));
                    bureaucrats.forEach(b => b.update(dt, player, resistanceFocus));
                    policeUnits.forEach(p => p.update(dt, player, cfg || getLevelConfig(6)));
                    if (resistanceFocus) resistanceFocus.update(dt);
                    safeZones.forEach(s => s.update(dt));
                    gasClouds.forEach(g => g.update(dt));
                    gasClouds = gasClouds.filter(g => g.life > 0);
                    if (flag) flag.update(dt);

                    totalTime += dt;
                    if (inclusiveCooldown > 0) inclusiveCooldown = Math.max(0, inclusiveCooldown - dt);

                    if (bossWave.active && gameState === STATE.BOSS_BATTLE && boss) {
                        bossWave.timer -= dt;
                        for (let i = 0; i < 10; i++) spawnTideParticle();
                        for (let p of policeUnits) if (p.stunTimer < 1.2) p.stun(2.0);
                        if (bossWave.timer <= 0) {
                            boss.hit(25);
                            if (boss.hp <= 0) {
                                sfxVictory();
                                setVictory();
                            }
                            if (bossWave.pending > 0) {
                                bossWave.pending--;
                                bossWave.timer = 2.4;
                            } else {
                                bossWave.active = false;
                            }
                        }
                    }

                    if (gameState === STATE.BOSS_BATTLE) {
                        bossSpawnTimer -= dt;
                        const freeCount = citizens.filter(c => !c.collected).length;
                        if (bossSpawnTimer <= 0 && freeCount < 14) {
                            const allTypes = ['jubilado', 'discapacitado', 'cientifico', 'feminista', 'universitario', 'obrero'];
                            citizens.push(new Citizen(
                                45 + Math.random() * (W - 90),
                                45 + Math.random() * (H - 90),
                                allTypes[Math.floor(Math.random() * allTypes.length)]
                            ));
                            bossSpawnTimer = 1.8 + Math.random() * 1.4;
                        }
                    }

                    if (mobilization.active) {
                        mobilization.timer -= dt;
                        for (let i = 0; i < 12; i++) spawnTideParticle();
                        for (let p of policeUnits) {
                            if (p.stunTimer > 0) continue;
                            for (let pt of particles) {
                                if (pt.isTide && Math.hypot(pt.x - p.x, pt.y - p.y) < pt.radius + p.radius) {
                                    p.stun(10);
                                    pt.life = 0;
                                    break;
                                }
                            }
                        }

                        if (mobilization.timer <= 0) {
                            policeUnits.forEach(p => p.stun(999));
                            bureaucrats.forEach(b => b.stun(999));
                            mobilization.active = false;
                            if (mobilization.isFinal) {
                                gameState = mobilization.outcomeState;
                                if (gameState === STATE.LEVEL_COMPLETE) sfxVictory();
                            }
                        }
                    }

                    if (!mobilization.active && gameState !== STATE.GAME_OVER && gameState !== STATE.VICTORY) {
                        playerCollect();
                        policeCapture();
                        bossCapture();
                        safeZoneProtect();
                        checkNearMiss();
                        if (gameState === STATE.PLAYING && cfg) {
                            checkFlagSpawn(cfg.required);
                        } else if (gameState === STATE.BOSS_BATTLE) {
                            boss.update(dt, player);
                            bossTauntTimer -= dt;
                            if (bossTauntTimer <= 0) {
                                let next = bossTauntText;
                                while (next === bossTauntText) next = BOSS_TAUNTS[Math.floor(Math.random() * BOSS_TAUNTS.length)];
                                bossTauntText = next;
                                bossTauntTimer = 7;
                            }
                        }
                        checkFlagCollection();
                    }

                    particles = particles.filter(p => p.alive ? (p.update(dt), true) : false);
                    floatingMessages.forEach(m => { if (m.life < 1000) m.life -= dt; if (m.small) m.y -= 24 * dt; });
                    floatingMessages = floatingMessages.filter(m => m.life > 0);

                    updateHUD(cfg);
                    drawWorld();
                }
                else if (gameState === STATE.BOSS_INTRO) {
                    drawWorld();

                    ctx.fillStyle = 'rgba(20, 20, 36, 0.92)';
                    ctx.fillRect(0, 0, W, H);

                    const titleSize = Math.min(22, W / 30);
                    ctx.fillStyle = '#ff3838';
                    ctx.font = `bold ${titleSize}px "Press Start 2P", cursive`;
                    ctx.textAlign = 'center';
                    ctx.shadowColor = '#000';
                    ctx.shadowBlur = 8;
                    ctx.fillText('¡EL PRESIDENTE APARECE!', W / 2, H * 0.14);
                    ctx.shadowBlur = 0;

                    ctx.fillStyle = '#e0e0e0';
                    ctx.font = `${Math.min(15, Math.max(11, W / 48))}px "Inter", sans-serif`;
                    const introLines = [
                        'Con la plata del FMI y el aval de la burocracia sindical conciliadora,',
                        'el presidente intenta pasar por encima del Congreso y del pueblo.',
                        '',
                        '¡Contás con todas las conquistas de la lucha popular:',
                        '🤝 Paso Colectivo · 💬 Asambleas · 🏥 Posta Sanitaria · 🗣️ Inclusivo (E)!',
                        '',
                        'Llegá a 10, 20, 30 y 40 organizados en tu columna',
                        'para lanzar 4 olas populares hacia la Gran Huelga General.'
                    ];
                    introLines.forEach((line, i) => {
                        ctx.fillText(line, W / 2, H * 0.28 + i * Math.min(26, W / 32));
                    });

                    ctx.fillStyle = '#ff3838';
                    ctx.font = `bold ${Math.min(15, Math.max(10, W / 45))}px "Press Start 2P", cursive`;
                    ctx.globalAlpha = 0.5 + Math.abs(Math.sin(Date.now() * 0.003)) * 0.5;
                    ctx.fillText('CLIC O ENTER PARA LUCHAR', W / 2, H * 0.9);
                    ctx.globalAlpha = 1;

                    bossIntroTimer += dt;
                    if (bossIntroTimer > 6 || keys[' '] || keys['enter']) {
                        gameState = STATE.BOSS_BATTLE;
                        bossIntroTimer = 0;
                    }
                }
                else if (gameState === STATE.ABILITY_UNLOCK) {
                    drawWorld();
                    drawAbilityUnlockOverlay(pendingUnlockLevel);
                }
                else if (gameState === STATE.LEVEL_COMPLETE) {
                    drawWorld();
                    const fistsStr = '✊'.repeat(lastEarnedStars) + '🤛'.repeat(3 - lastEarnedStars);
                    const fistDetail = lastEarnedStars === 3 ? "¡Organización ejemplar! (+20% de compañerxs)" :
                                       (lastEarnedStars === 2 ? "¡Gran convocatoria! (+10% de compañerxs)" : "¡Meta cumplida! (Podés juntar más para 3✊)");
                    drawOverlay('¡SECTOR ORGANIZADO!',
                        `Completaste: ${LEVEL_TITLES[currentLevel]}\n` +
                        `Puños de lucha en este nivel: ${fistsStr} (${lastEarnedStars}/3)\n` +
                        `${fistDetail}\n` +
                        `Puños en alto acumulados: ${totalStarsEarned} / 18 ✊\n` +
                        `Tiempo acumulado: ${formatTime(totalTime)}`,
                        'CONTINUAR'
                    );
                }
                else if (gameState === STATE.GAME_OVER) {
                    drawWorld();
                    const rec = score >= highScore && score > 0;
                    drawOverlay('LA ORGANIZACIÓN FRACASÓ', `La represión logró dispersar la columna.\nTiempo: ${formatTime(totalTime)} · Puntaje: ${score}` + (rec ? '\n¡Nuevo récord!' : `\nRécord: ${highScore}`), 'VOLVER A INTENTAR');
                    drawShareHint();
                }
                else if (gameState === STATE.VICTORY) {
                    drawWorld();
                }

                requestAnimationFrame(loop);
            }
        })();
    </script>
</body>
</html>
