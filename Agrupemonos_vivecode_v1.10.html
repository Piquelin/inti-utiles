            // Nube de Gas Lacrimógeno lanzada por la policía (desde Nivel 2)
            class TearGasCloud {
                constructor(x, y) {
                    this.x = x;
                    this.y = y;
                    this.radius = 65;
                    this.life = 7.5;
                    this.seed = Math.random() * 100;
                }
                update(dt) {
                    this.life -= dt;
                }
                draw(ctx) {
                    if (this.life <= 0) return;
                    const alpha = Math.min(1, this.life / 1.5) * 0.42;
                    const pulse = Math.sin(Date.now() * 0.004 + this.seed) * 6;
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius + pulse, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(195, 220, 70, ${alpha})`;
                    ctx.fill();
                    ctx.strokeStyle = `rgba(220, 240, 100, ${alpha * 1.4})`;
                    ctx.lineWidth = 2;
                    ctx.setLineDash([6, 6]);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    for (let i = 0; i < 3; i++) {
                        const ang = this.seed + i * 2.1 + Date.now() * 0.0015;
                        const ox = Math.cos(ang) * (this.radius * 0.38);
                        const oy = Math.sin(ang) * (this.radius * 0.38);
                        ctx.beginPath();
                        ctx.arc(this.x + ox, this.y + oy, this.radius * 0.45, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(180, 210, 60, ${alpha * 0.75})`;
                        ctx.fill();
                    }

                    ctx.font = '22px "Segoe UI Emoji", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.globalAlpha = Math.min(1, this.life);
                    ctx.fillText('💨', this.x, this.y);
                    ctx.restore();
                }
            }

            // Brigadista de la Posta de Salud (se desbloquea al completar Científicos en Nivel 3)
            class HealthBrigadista {
                constructor(x, y) {
                    this.x = x;
                    this.y = y;
                    this.radius = 22;
                    this.speed = BRIGADISTA_SPEED;
                    this.emoji = '🧑🏽‍⚕️';
                    this.healCooldown = 0;
                    this.patrolAngle = Math.random() * Math.PI * 2;
                }
                update(dt) {
                    if (this.healCooldown > 0) this.healCooldown -= dt;

                    // Buscar afectado más cercano (priorizando la columna del jugador)
                    let target = null;
                    let minDist = Infinity;

                    if (player) {
                        const hasGassedInCol = player.collected.some(c => c.gassed > 0) || player.inGas;
                        if (hasGassedInCol) {
                            target = player;
                            minDist = Math.hypot(player.x - this.x, player.y - this.y) * 0.75;
                        }
                    }

                    for (let c of citizens) {
                        if (c.collected || c.gassed <= 0) continue;
                        const d = Math.hypot(c.x - this.x, c.y - this.y);
                        if (d < minDist) {
                            minDist = d;
                            target = c;
                        }
                    }

                    if (target) {
                        const ang = Math.atan2(target.y - this.y, target.x - this.x);
                        this.x += Math.cos(ang) * this.speed * dt * 60;
                        this.y += Math.sin(ang) * this.speed * dt * 60;
                    } else if (player) {
                        const homeX = resistanceFocus ? (resistanceFocus.x * 0.5 + player.x * 0.5) : player.x;
                        const homeY = resistanceFocus ? (resistanceFocus.y * 0.5 + player.y * 0.5) : player.y;
                        const dHome = Math.hypot(homeX - this.x, homeY - this.y);
                        if (dHome > 90) {
                            const ang = Math.atan2(homeY - this.y, homeX - this.x);
                            this.x += Math.cos(ang) * (this.speed * 0.65) * dt * 60;
                            this.y += Math.sin(ang) * (this.speed * 0.65) * dt * 60;
                        } else {
                            this.patrolAngle += dt * 1.2;
                            this.x += Math.cos(this.patrolAngle) * 0.6 * dt * 60;
                            this.y += Math.sin(this.patrolAngle) * 0.6 * dt * 60;
                        }
                    }

                    this.x = Math.max(this.radius, Math.min(W - this.radius, this.x));
                    this.y = Math.max(this.radius, Math.min(H - this.radius, this.y));

                    // Curar o concientizar a ciudadanos sueltos al tocarlos
                    for (let c of citizens) {
                        if (c.collected) continue;
                        if (c.gassed <= 0 && (!c.demobilized || c.demobilized <= 0)) continue;
                        if (Math.hypot(c.x - this.x, c.y - this.y) < this.radius + c.radius + 10) {
                            if (c.demobilized > 0) {
                                c.demobilized = 0;
                                c.pickupLock = 0;
                                spawnHealParticles(c.x, c.y);
                                floatingMessages.push({ text: '✊ ¡Concientizadx!', life: 1.0, color: '#2ed573', x: c.x, y: c.y - 28, small: true });
                            }
                            c.gassed = 0;
                            c.gasImmunity = GAS_IMMUNITY_TIME;
                            for (let g of gasClouds) {
                                if (Math.hypot(c.x - g.x, c.y - g.y) < g.radius + c.radius) {
                                    c.wanderAngle = Math.atan2(c.y - g.y, c.x - g.x);
                                    c.wanderTimer = 1.5;
                                    break;
                                }
                            }
                            sfxHeal();
                            spawnHealParticles(c.x, c.y);
                            floatingMessages.push({
                                text: '➕ ¡Atendidx!',
                                life: 1.1, color: '#2ed573',
                                x: c.x, y: c.y - 30, small: true
                            });
                        }
                    }

                    // Curar a la columna cuando toca al jugador o a cualquier integrante
                    if (player && this.healCooldown <= 0) {
                        let touchedColumn = Math.hypot(player.x - this.x, player.y - this.y) < this.radius + player.radius + 14;
                        if (!touchedColumn) {
                            for (let c of player.collected) {
                                if (Math.hypot(c.x - this.x, c.y - this.y) < this.radius + c.radius + 12) {
                                    touchedColumn = true;
                                    break;
                                }
                            }
                        }
                        if (touchedColumn) {
                            let cured = 0;
                            if (player.inGas && player.gasImmunity <= 0) {
                                player.gasImmunity = GAS_IMMUNITY_TIME;
                                cured++;
                            }
                            for (let c of player.collected) {
                                if (c.gassed > 0) {
                                    c.gassed = 0;
                                    c.gasImmunity = GAS_IMMUNITY_TIME;
                                    spawnHealParticles(c.x, c.y);
                                    cured++;
                                }
                            }
                            if (cured > 0) {
                                this.healCooldown = 1.0;
                                sfxHeal();
                                floatingMessages.push({
                                    text: '🏥 ¡Brigadista curó a la columna!',
                                    life: 1.3, color: '#2ed573',
                                    x: player.x, y: player.y - 42, small: true
                                });
                            }
                        }
                    }
                }
                draw(ctx) {
                    ctx.save();
                    const pulse = (Math.sin(Date.now() * 0.006) + 1) * 0.5;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius + 4 + pulse * 3, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(46, 213, 115, 0.25)';
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(46, 213, 115, 0.85)';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#2ed573';
                    ctx.fill();
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2.5;
                    ctx.stroke();

                    ctx.font = '26px "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(this.emoji, this.x, this.y + 2);

                    ctx.beginPath();
                    ctx.arc(this.x + this.radius - 3, this.y - this.radius + 3, 9, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                    ctx.strokeStyle = '#2ed573';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                    ctx.font = '12px "Segoe UI Emoji", sans-serif';
                    ctx.fillText('➕', this.x + this.radius - 3, this.y - this.radius + 4);
                    ctx.restore();
                }
            }

            // Protagonista (ícono del megáfono 📢)
            class Player {
                constructor(x, y) {
                    this.x = x;
                    this.y = y;
                    this.radius = 22;
                    this.speed = (!paceUnlocked && currentLevel === 1) ? 4.55 : 3.45;
                    this.collected = [];
                    this.trail = [];
                    this.invuln = 0;
                    this.facing = 1;
                    this.inGas = false;
                    this.gasImmunity = 0;
                    this.strainWarningCooldown = 0;
                }
                update(dt) {
                    this.speed = (!paceUnlocked && currentLevel === 1) ? 4.55 : 3.45;
                    if (this.strainWarningCooldown > 0) this.strainWarningCooldown -= dt;
                    if (this.gasImmunity > 0) this.gasImmunity = Math.max(0, this.gasImmunity - dt);

                    let dx = 0, dy = 0;
                    if (keys['w'] || keys['arrowup']) dy = -1;
                    if (keys['s'] || keys['arrowdown']) dy = 1;
                    if (keys['a'] || keys['arrowleft']) { dx = -1; this.facing = -1; }
                    if (keys['d'] || keys['arrowright']) { dx = 1; this.facing = 1; }
                    const mag = Math.sqrt(dx * dx + dy * dy);
                    if (mag > 1) { dx /= mag; dy /= mag; }

                    // Chequear si el jugador pisa gas lacrimógeno
                    this.inGas = false;
                    if (this.gasImmunity <= 0) {
                        for (let g of gasClouds) {
                            if (Math.hypot(this.x - g.x, this.y - g.y) < g.radius + this.radius * 0.5) {
                                this.inGas = true;
                                break;
                            }
                        }
                    }

                    // Integrantes de la columna que pasan sobre gas
                    for (let c of this.collected) {
                        if (c.gasImmunity > 0) {
                            c.gasImmunity = Math.max(0, c.gasImmunity - dt);
                        } else {
                            for (let g of gasClouds) {
                                if (Math.hypot(c.x - g.x, c.y - g.y) < g.radius + c.radius * 0.4) {
                                    c.gassed = Math.max(c.gassed, 5.5);
                                }
                            }
                        }
                        if (c.gassed > 0) {
                            c.gassed = Math.max(0, c.gassed - dt * 0.18);
                        }
                    }

                    const gasPlayerFactor = this.inGas ? 0.55 : 1.0;
                    const gassedInCol = this.collected.filter(c => c.gassed > 0).length;
                    const colGasFactor = Math.max(0.52, 1 - gassedInCol * 0.06);
                    const spd = this.speed * gasPlayerFactor * colGasFactor;

                    this.x += dx * spd * dt * 60;
                    this.y += dy * spd * dt * 60;
                    this.x = Math.max(this.radius, Math.min(W - this.radius, this.x));
                    this.y = Math.max(this.radius, Math.min(H - this.radius, this.y));

                    this.trail.push({ x: this.x, y: this.y });
                    if (this.trail.length > 55) this.trail.shift();
                    if (this.invuln > 0) this.invuln -= dt;

                    // Movimiento de seguidores:
                    // Nivel 1 (sin Paso Colectivo): los seguidores van más lento y se sueltan si te alejás demasiado
                    if (!paceUnlocked && currentLevel === 1) {
                        for (let i = 0; i < this.collected.length; i++) {
                            const c = this.collected[i];
                            const leader = (i === 0) ? this : this.collected[i - 1];
                            const targetDist = 30;
                            const d = Math.hypot(leader.x - c.x, leader.y - c.y);
                            if (d > targetDist) {
                                const ang = Math.atan2(leader.y - c.y, leader.x - c.x);
                                const maxFollowSpd = 3.05 * (c.gassed > 0 ? 0.6 : 1.0);
                                const step = Math.min(d - targetDist, maxFollowSpd * dt * 60);
                                c.x += Math.cos(ang) * step;
                                c.y += Math.sin(ang) * step;
                            }
                            c.linkDist = d;
                        }

                        for (let i = this.collected.length - 1; i >= 0; i--) {
                            const c = this.collected[i];
                            if (c.linkDist > 110 && this.strainWarningCooldown <= 0) {
                                this.strainWarningCooldown = 1.4;
                                floatingMessages.push({
                                    text: '⚠️ ¡Vas muy rápido, esperá al grupo!',
                                    life: 1.2, color: '#eccc68',
                                    x: c.x, y: c.y - 32, small: true
                                });
                            }
                            if (c.linkDist > 165) {
                                const dropped = this.collected.splice(i);
                                for (let dc of dropped) {
                                    dc.free = true;
                                    dc.collected = false;
                                    dc.pickupLock = 1.0;
                                    dc.wanderAngle = Math.random() * Math.PI * 2;
                                    citizens.push(dc);
                                }
                                sfxDrop();
                                                                floatingMessages.push({
                                    text: '¡Alguien quedó atrás! Caminá más despacio',
                                    life: 1.8, color: '#ff6b81',
                                    x: this.x, y: this.y - 45, small: true
                                });
                                break;
                            }
                        }
                    } else {
                        // A partir del Nivel 2 (Paso Colectivo): nadie se queda atrás
                        for (let i = 0; i < this.collected.length; i++) {
                            const c = this.collected[i];
                            const idx = Math.min(i + 3, this.trail.length - 1);
                            const t = this.trail[this.trail.length - 1 - idx] || { x: this.x, y: this.y };
                            const angle = i * 1.2 + Date.now() * 0.002;
                            const dist = 22 + (i % 5) * 8;
                            c.x += (t.x + Math.cos(angle) * dist - c.x) * 0.15;
                            c.y += (t.y + Math.sin(angle) * dist - c.y) * 0.15;
                            c.linkDist = 0;
                        }
                    }
                }
                draw(ctx) {
                    // En Nivel 1, dibujar líneas de tensión entre los eslabones de la fila
                    if (!paceUnlocked && currentLevel === 1 && this.collected.length > 0) {
                        for (let i = 0; i < this.collected.length; i++) {
                            const c = this.collected[i];
                            const leader = (i === 0) ? this : this.collected[i - 1];
                            const d = Math.hypot(leader.x - c.x, leader.y - c.y);
                            ctx.beginPath();
                            ctx.moveTo(leader.x, leader.y);
                            ctx.lineTo(c.x, c.y);
                            if (d > 105) {
                                ctx.strokeStyle = '#ff4757';
                                ctx.lineWidth = 3;
                                ctx.setLineDash([4, 4]);
                            } else if (d > 75) {
                                ctx.strokeStyle = '#eccc68';
                                ctx.lineWidth = 2;
                                ctx.setLineDash([]);
                            } else {
                                ctx.strokeStyle = 'rgba(255, 56, 56, 0.45)';
                                ctx.lineWidth = 2;
                                ctx.setLineDash([]);
                            }
                            ctx.stroke();
                            ctx.setLineDash([]);
                        }
                    }



                    if (this.invuln > 0 && Math.floor(this.invuln * 20) % 2 === 0) ctx.globalAlpha = 0.5;

                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#ff3838';
                    ctx.fill();
                    ctx.strokeStyle = this.gasImmunity > 0 ? '#2ed573' : '#ffffff';
                    ctx.lineWidth = 2.5;
                    ctx.stroke();

                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.scale(this.facing, 1);
                    ctx.font = '27px "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('📢', 0, 2);
                    ctx.restore();

                    ctx.globalAlpha = 1;

                    if (this.inGas) {
                        ctx.font = '18px "Segoe UI Emoji", sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText('😢', this.x, this.y - this.radius - 10);
                    }

                    if (this.collected.length >= 6) {
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.radius + 10, 0, Math.PI * 2);
                        ctx.strokeStyle = '#ff3838';
                        ctx.lineWidth = 2;
                        ctx.setLineDash([4, 4]);
                        ctx.stroke();
                        ctx.setLineDash([]);
                    }
                }
                getStrength() { return this.collected.length; }
                addCitizen(c) {
                    if (this.collected.length < 50) {
                        c.free = false;
                        c.collected = true;
                        if (!paceUnlocked && currentLevel === 1 && this.collected.length > 0) {
                            const last = this.collected[this.collected.length - 1];
                            const d = Math.hypot(c.x - last.x, c.y - last.y);
                            if (d > 65) {
                                const ang = Math.atan2(c.y - last.y, c.x - last.x);
                                c.x = last.x + Math.cos(ang) * 45;
                                c.y = last.y + Math.sin(ang) * 45;
                            }
                        }
                        this.collected.push(c);
                        sfxCollect();

                        for (let i = 0; i < 5; i++) {
                            particles.push({
                                x: c.x, y: c.y,
                                color: '#ff3838', life: 0.5,
                                vx: (Math.random() - 0.5) * 100, vy: (Math.random() - 0.5) * 100,
                                radius: 3,
                                update(dt) { this.life -= dt; this.x += this.vx * dt; this.y += this.vy * dt; },
                                draw(ctx) { ctx.globalAlpha = this.life * 2; ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; },
                                alive() { return this.life > 0; }
                            });
                        }
                    }
                }
                loseCitizens(n) {
                    const lost = [];
                    for (let i = 0; i < n && this.collected.length > 0; i++) {
                        const c = this.collected.pop();
                        c.free = true;
                        c.collected = false;
                        c.x = Math.max(c.radius, Math.min(W - c.radius, this.x + (Math.random() - 0.5) * 80));
                        c.y = Math.max(c.radius, Math.min(H - c.radius, this.y + (Math.random() - 0.5) * 80));
                        c.pickupLock = 1.1;
                        c.scatter = 0.4;
                        c.wanderAngle = Math.random() * Math.PI * 2;
                        lost.push(c);
                        citizens.push(c);
                    }
                    this.invuln = 1.0;
                    cameraShake = 10;
                    return lost;
                }
            }

            class Citizen {
                constructor(x, y, type) {
                    this.x = x;
                    this.y = y;
                    this.radius = 22;
                    this.free = true;
                    this.collected = false;
                    this.wanderAngle = Math.random() * Math.PI * 2;
                    this.wanderTimer = Math.random() * 3;
                    this.speed = 0.6;
                    this.scatter = 0;
                    this.pickupLock = 0;
                    this.gassed = 0;
                    this.gasImmunity = 0;
                    this.demobilized = 0;
                    this.assembly = null;
                    this.assemblyCooldown = 0;
                    this.linkDist = 0;
                    this.type = type;
                    this.emoji = this.getEmoji();
                    this.cryEmoji = Math.random() < 0.5 ? '😢' : '😭';
                }
                getEmoji() {
                    if (this.type === 'discapacitado') return ['👨‍🦽', '👩🏻‍🦽', '👩‍🦯', '🧑🏼‍🦯'][Math.floor(Math.random() * 4)];
                    if (this.type === 'jubilado') return ['👴🏽', '👵🏽', '🧓🏼', '👩🏽‍🦳'][Math.floor(Math.random() * 4)];
                    if (this.type === 'cientifico') return ['👩🏻‍⚕️', '👩‍🔬', '🔬', '👨🏽‍🔬'][Math.floor(Math.random() * 4)];
                    if (this.type === 'feminista') return ['👩🏽', '👩🏻', '👩🏿', '🦱', '🪂', '👬', '👭'][Math.floor(Math.random() * 7)];
                    if (this.type === 'universitario') return ['👩🏽‍🎓', '👩🏻‍🏫', '👩‍🔬', '🧑🏻‍💼', '👩🏻‍💼'][Math.floor(Math.random() * 5)];
                    if (this.type === 'obrero') return ['🧑‍🏭', '👷', '👨‍🏭', '👩‍🏭', '🛞', '🔧'][Math.floor(Math.random() * 6)];
                    return '👤';
                }
                update(dt, config) {
                    if (this.collected) return;
                    if (this.pickupLock > 0) this.pickupLock = Math.max(0, this.pickupLock - dt);
                    if (this.gasImmunity > 0) this.gasImmunity = Math.max(0, this.gasImmunity - dt);
                    if (this.demobilized > 0) this.demobilized = Math.max(0, this.demobilized - dt);
                    if (this.assemblyCooldown > 0) this.assemblyCooldown = Math.max(0, this.assemblyCooldown - dt);
                    if (this.assembly) return; // Mantiene formación de asamblea

                    if (this.gasImmunity <= 0) {
                        for (let g of gasClouds) {
                            if (Math.hypot(this.x - g.x, this.y - g.y) < g.radius + this.radius * 0.6) {
                                this.gassed = Math.max(this.gassed, 6.5);
                            }
                        }
                    }

                    if (this.gassed > 0) {
                        this.gassed = Math.max(0, this.gassed - dt * 0.2);
                        if (resistanceFocus && resistanceFocus.active && resistanceFocus.contains(this.x, this.y, this.radius)) {
                            this.gassed = 0;
                            this.gasImmunity = GAS_IMMUNITY_TIME;
                            spawnHealParticles(this.x, this.y);
                        }
                    }

                    if (this.scatter > 0) this.scatter -= dt;

                    const gasSlow = this.gassed > 0 ? 0.28 : 1.0;
                    this.speed = config.citizenSpeed * gasSlow;
                    this.wanderTimer -= dt;
                    if (this.wanderTimer <= 0) {
                        this.wanderAngle += (Math.random() - 0.5) * 1.5;
                        this.wanderTimer = 1.5 + Math.random() * 2.5;
                    }

                    this.x += Math.cos(this.wanderAngle) * this.speed * dt * 60;
                    this.y += Math.sin(this.wanderAngle) * this.speed * dt * 60;

                    // Rebote por ángulo simple en los bordes
                    if (this.x <= this.radius) { this.x = this.radius; this.wanderAngle = Math.PI - this.wanderAngle; }
                    else if (this.x >= W - this.radius) { this.x = W - this.radius; this.wanderAngle = Math.PI - this.wanderAngle; }
                    if (this.y <= this.radius) { this.y = this.radius; this.wanderAngle = -this.wanderAngle; }
                    else if (this.y >= H - this.radius) { this.y = H - this.radius; this.wanderAngle = -this.wanderAngle; }
                }
                draw(ctx) {
                    if (this.collected) return;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    if (this.gassed > 0) {
                        ctx.fillStyle = '#d2dae2';
                        ctx.fill();
                        ctx.strokeStyle = '#badc58';
                        ctx.lineWidth = 3;
                        ctx.stroke();
                    } else if (this.demobilized > 0) {
                        ctx.fillStyle = '#dfe6e9';
                        ctx.fill();
                        ctx.strokeStyle = '#74b9ff';
                        ctx.lineWidth = 2.5;
                        ctx.stroke();
                    } else if (this.gasImmunity > 0) {
                        ctx.fillStyle = '#e8f8f5';
                        ctx.fill();
                        ctx.strokeStyle = '#2ed573';
                        ctx.lineWidth = 2.5;
                        ctx.stroke();
                    } else {
                        ctx.fillStyle = '#ffffff';
                        ctx.fill();
                        ctx.strokeStyle = '#2f3542';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }

                    ctx.fillStyle = '#000';
                    ctx.font = '28px "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    const displayEmoji = this.gassed > 0 ? this.cryEmoji : (this.demobilized > 0 ? '😴' : this.emoji);
                    ctx.fillText(displayEmoji, this.x, this.y + 2);

                    if (this.gassed > 0) {
                        ctx.font = '14px "Segoe UI Emoji", sans-serif';
                        ctx.fillText('💨', this.x + this.radius - 4, this.y - this.radius + 4);
                    } else if (this.demobilized > 0) {
                        ctx.font = '12px "Segoe UI Emoji", sans-serif';
                        ctx.fillText('💤', this.x + this.radius - 4, this.y - this.radius + 4);
                    }
                }
                drawCollected(ctx, x, y) {
                    ctx.save();
                    ctx.translate(x, y);
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = this.gassed > 0 ? '#a4b0be' : '#ff3838';
                    ctx.fill();
                    ctx.strokeStyle = this.gassed > 0 ? '#badc58' : '#ff6b6b';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.fillStyle = '#000';
                    ctx.font = '28px "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(this.gassed > 0 ? this.cryEmoji : this.emoji, 0, 2);
                    ctx.restore();
                }
            }

            class PoliceUnit {
                constructor(x, y, speed) {
                    this.x = x;
                    this.y = y;
                    this.radius = 22;
                    this.speed = speed;
                    this.state = 'patrol';
                    this.stunTimer = 0;
                    this.patrolAngle = Math.random() * Math.PI * 2;
                    this.patrolTimer = 0;
                    this.nearMissCd = 0;
                    this.gasCooldown = 3.5 + Math.random() * 6.0;
                    this.emoji = Math.random() < 0.5 ? '🧑🏻‍✈️' : '👩🏻‍✈️';
                }
                update(dt, playerRef, config) {
                    if (this.stunTimer > 0) { this.stunTimer -= dt; return; }
                    if (this.nearMissCd > 0) this.nearMissCd -= dt;
                    this.speed = config.policeSpeed;

                    // Lanzar gases lacrimógenos a partir del Nivel 2
                    if (currentLevel >= 2) {
                        this.gasCooldown -= dt;
                        if (this.gasCooldown <= 0 && gasClouds.length < 3) {
                            const inFocus = resistanceFocus && resistanceFocus.contains(this.x, this.y, 85);
                            if (!inFocus) {
                                gasClouds.push(new TearGasCloud(this.x, this.y));
                                sfxGas();
                            }
                            this.gasCooldown = 8.5 + Math.random() * 6.0;
                        }
                    }

                    let target = null, minDist = Infinity;
                    if (playerRef && playerRef.getStrength() > 0) {
                        const d = Math.hypot(this.x - playerRef.x, this.y - playerRef.y);
                        if (d < 300) { target = playerRef; minDist = d; }
                    }
                    for (let c of citizens) {
                        if (c.collected || c.scatter > 0) continue;
                        const d = Math.hypot(this.x - c.x, this.y - c.y);
                        if (d < 190 && d < minDist) { target = c; minDist = d; }
                    }

                    if (target && minDist < 250) {
                        this.state = 'chase';
                        const angle = Math.atan2(target.y - this.y, target.x - this.x);
                        this.x += Math.cos(angle) * this.speed * 1.2 * dt * 60;
                        this.y += Math.sin(angle) * this.speed * 1.2 * dt * 60;
                    } else {
                        this.state = 'patrol';
                        this.patrolTimer -= dt;
                        if (this.patrolTimer <= 0) {
                            this.patrolAngle += (Math.random() - 0.5) * 2;
                            this.patrolTimer = 2 + Math.random() * 3;
                        }
                        this.x += Math.cos(this.patrolAngle) * this.speed * 0.55 * dt * 60;
                        this.y += Math.sin(this.patrolAngle) * this.speed * 0.55 * dt * 60;
                    }

                    // Rebote por ángulo simple en los bordes
                    if (this.x <= this.radius) { this.x = this.radius; this.patrolAngle = Math.PI - this.patrolAngle; }
                    else if (this.x >= W - this.radius) { this.x = W - this.radius; this.patrolAngle = Math.PI - this.patrolAngle; }
                    if (this.y <= this.radius) { this.y = this.radius; this.patrolAngle = -this.patrolAngle; }
                    else if (this.y >= H - this.radius) { this.y = H - this.radius; this.patrolAngle = -this.patrolAngle; }
                }
                draw(ctx) {
                    if (this.stunTimer > 0 && Math.floor(this.stunTimer * 15) % 2 === 0) return;

                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#1e90ff';
                    ctx.fill();
                    ctx.strokeStyle = '#2f3542';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    ctx.fillStyle = '#000';
                    ctx.font = '28px "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(this.emoji, this.x, this.y + 2);

                    if (this.stunTimer > 0.6) {
                        ctx.font = '22px "Segoe UI Emoji", sans-serif';
                        ctx.fillText('💬', this.x, this.y - this.radius - 10);
                    }
                }
                stun(d) { this.stunTimer = d; this.state = 'stunned'; }
            }

            // ==================== BURÓCRATA SINDICAL ====================
            // Obrero con fondo azul distintivo que busca conciliar y desmovilizar a los trabajadores
            class Bureaucrat {
                constructor(x, y) {
                    this.x = x;
                    this.y = y;
                    this.radius = 22;
                    this.speed = 1.25;
                    this.stunTimer = 0;
                    this.wanderAngle = Math.random() * Math.PI * 2;
                    this.wanderTimer = 1.5;
                    this.actionCooldown = 2.0;
                    this.shoutCooldown = 4.0 + Math.random() * 3.0;
                    this.emoji = '🧑‍🏭';
                    this.shouts = [
                        "¡Paz social, muchachos!",
                        "¡Esperen a las paritarias!",
                        "¡No hagan olas!",
                        "¡Conciliación obligatoria!",
                        "¡Esperen al 2027!",
                        "¡Arreglemos por abajo!"
                    ];
                }
                stun(duration) {
                    this.stunTimer = Math.max(this.stunTimer, duration);
                }
                update(dt, playerRef, focusRef) {
                    if (this.stunTimer > 0) {
                        this.stunTimer -= dt;
                        return;
                    }
                    if (this.actionCooldown > 0) this.actionCooldown -= dt;
                    if (this.shoutCooldown > 0) {
                        this.shoutCooldown -= dt;
                        if (this.shoutCooldown <= 0) {
                            this.shoutCooldown = 6.0 + Math.random() * 5.0;
                            const msg = this.shouts[Math.floor(Math.random() * this.shouts.length)];
                            floatingMessages.push({
                                text: msg,
                                life: 1.7,
                                color: '#74b9ff',
                                x: this.x,
                                y: this.y - 32,
                                small: true
                            });
                        }
                    }

                    // La asamblea obrera (foco de resistencia SUTNA) repudia y expulsa a la burocracia
                    if (focusRef && focusRef.active) {
                        const dFocus = Math.hypot(this.x - focusRef.x, this.y - focusRef.y);
                        if (dFocus < focusRef.radius + 40) {
                            this.stun(3.0);
                            const repelAng = Math.atan2(this.y - focusRef.y, this.x - focusRef.x);
                            this.x += Math.cos(repelAng) * 30;
                            this.y += Math.sin(repelAng) * 30;
                            floatingMessages.push({
                                text: "¡Fuera la burocracia sindical!",
                                life: 1.6,
                                color: '#eccc68',
                                x: this.x,
                                y: this.y - 30,
                                small: true
                            });
                            return;
                        }
                    }

                    // Buscar trabajadores sueltos o la columna del jugador
                    let target = null;
                    let minDist = 220;

                    // Priorizar intervenir y desmovilizar asambleas de base
                    if (assemblies.length > 0) {
                        for (let asm of assemblies) {
                            const d = Math.hypot(this.x - asm.x, this.y - asm.y);
                            if (d < 260 && d < minDist) {
                                minDist = d;
                                target = asm;
                            }
                        }
                    }

                    for (let c of citizens) {
                        if (c.collected || (c.demobilized && c.demobilized > 0)) continue;
                        const d = Math.hypot(this.x - c.x, this.y - c.y);
                        if (d < minDist) {
                            minDist = d;
                            target = c;
                        }
                    }

                    if (playerRef && playerRef.getStrength() > 0) {
                        const dPlayer = Math.hypot(this.x - playerRef.x, this.y - playerRef.y);
                        if (dPlayer < 240) target = playerRef;
                    }

                    if (target) {
                        const ang = Math.atan2(target.y - this.y, target.x - this.x);
                        this.x += Math.cos(ang) * this.speed * dt * 60;
                        this.y += Math.sin(ang) * this.speed * dt * 60;
                    } else {
                        this.wanderTimer -= dt;
                        if (this.wanderTimer <= 0) {
                            this.wanderAngle += (Math.random() - 0.5) * 1.6;
                            this.wanderTimer = 1.8 + Math.random() * 2.0;
                        }
                        this.x += Math.cos(this.wanderAngle) * this.speed * 0.7 * dt * 60;
                        this.y += Math.sin(this.wanderAngle) * this.speed * 0.7 * dt * 60;
                    }

                    // Rebote simple en bordes
                    if (this.x <= this.radius) { this.x = this.radius; this.wanderAngle = Math.PI - this.wanderAngle; }
                    else if (this.x >= W - this.radius) { this.x = W - this.radius; this.wanderAngle = Math.PI - this.wanderAngle; }
                    if (this.y <= this.radius) { this.y = this.radius; this.wanderAngle = -this.wanderAngle; }
                    else if (this.y >= H - this.radius) { this.y = H - this.radius; this.wanderAngle = -this.wanderAngle; }

                    // Desmovilizar asamblea entera o ciudadano suelto al tocarlo
                    if (this.actionCooldown <= 0) {
                        // 1. Tocar una asamblea desmoviliza a todo el grupo a la vez
                        for (let i = assemblies.length - 1; i >= 0; i--) {
                            const asm = assemblies[i];
                            if (Math.hypot(this.x - asm.x, this.y - asm.y) < this.radius + asm.radius + 8) {
                                const group = [...asm.members];
                                assemblies.splice(i, 1);
                                group.forEach(m => {
                                    m.assembly = null;
                                    m.assemblyCooldown = 5.0;
                                    m.demobilized = 4.5;
                                    m.pickupLock = 4.5;
                                });
                                this.actionCooldown = 3.5;
                                floatingMessages.push({
                                    text: '😴 ¡Asamblea frenada por pacto de cúpula!',
                                    life: 2.0,
                                    color: '#74b9ff',
                                    x: asm.x,
                                    y: asm.y - 32,
                                    small: true
                                });
                                break;
                            }
                        }

                        if (this.actionCooldown <= 0) {
                            for (let c of citizens) {
                                if (c.collected || (c.demobilized && c.demobilized > 0)) continue;
                                if (Math.hypot(this.x - c.x, this.y - c.y) < this.radius + c.radius + 6) {
                                    c.demobilized = 4.5;
                                    c.pickupLock = 4.5;
                                    this.actionCooldown = 3.0;
                                    floatingMessages.push({
                                        text: '😴 Adormecidx por tregua burocrática',
                                        life: 1.5,
                                        color: '#74b9ff',
                                        x: c.x,
                                        y: c.y - 30,
                                        small: true
                                    });
                                    break;
                                }
                            }
                        }
                    }

                    // Si toca la columna del jugador fuera del foco de resistencia, intenta descolgar al último
                    if (playerRef && this.actionCooldown <= 0 && playerRef.getStrength() > 0) {
                        const inFocus = focusRef && focusRef.contains(playerRef.x, playerRef.y, playerRef.radius);
                        if (!inFocus) {
                            let hitIdx = -1;
                            for (let i = playerRef.collected.length - 1; i >= 0; i--) {
                                const c = playerRef.collected[i];
                                if (Math.hypot(this.x - c.x, this.y - c.y) < this.radius + c.radius + 8) {
                                    hitIdx = i;
                                    break;
                                }
                            }
                            if (hitIdx === -1 && Math.hypot(this.x - playerRef.x, this.y - playerRef.y) < this.radius + playerRef.radius + 8) {
                                hitIdx = playerRef.collected.length - 1;
                            }

                            if (hitIdx >= 0) {
                                const detached = playerRef.collected.splice(hitIdx, 1)[0];
                                if (detached) {
                                    detached.free = true;
                                    detached.collected = false;
                                    detached.demobilized = 4.0;
                                    detached.pickupLock = 3.5;
                                    detached.x = this.x + (Math.random() - 0.5) * 30;
                                    detached.y = this.y + (Math.random() - 0.5) * 30;
                                    detached.wanderAngle = Math.random() * Math.PI * 2;
                                    citizens.push(detached);
                                    sfxDrop();
                                    this.actionCooldown = 3.5;
                                    floatingMessages.push({
                                        text: '¡Conciliación obligatoria! -1 en columna',
                                        life: 1.8,
                                        color: '#0984e3',
                                        x: playerRef.x,
                                        y: playerRef.y - 45,
                                        small: true
                                    });
                                }
                            }
                        }
                    }
                }
                draw(ctx) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    // Obrero con fondo azul distintivo de la burocracia sindical
                    ctx.fillStyle = '#0984e3';
                    ctx.fill();
                    ctx.strokeStyle = '#74b9ff';
                    ctx.lineWidth = 3;
                    ctx.stroke();

                    if (this.stunTimer > 0) {
                        ctx.fillStyle = 'rgba(255, 234, 167, 0.4)';
                        ctx.fill();
                    }

                    ctx.fillStyle = '#000';
                    ctx.font = '28px "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(this.emoji, this.x, this.y + 2);

                    // Distintivo de maletín
                    ctx.font = '13px "Segoe UI Emoji", sans-serif';
                    ctx.fillText('💼', this.x + this.radius - 4, this.y - this.radius + 4);

                    if (this.stunTimer > 0) {
                        ctx.font = '16px "Segoe UI Emoji", sans-serif';
                        ctx.fillText('💫', this.x, this.y - this.radius - 8);
                    } else {
                        ctx.font = 'bold 9px "Inter", sans-serif';
                        ctx.fillStyle = '#74b9ff';
                        ctx.fillText('BURÓCRATA', this.x, this.y + this.radius + 12);
                    }
                    ctx.restore();
                }
            }

            // ==================== PEQUEÑAS ASAMBLEAS ESPONTÁNEAS ====================
            // Desbloqueadas tras el Nivel 2: autoorganización de base que reúne a 2-3 manifestantes
            class CitizenAssembly {
                constructor(members) {
                    this.members = members;
                    this.radius = 32;
                    this.timer = 8.5;
                    this.seed = Math.random() * 100;
                    this.x = 0;
                    this.y = 0;
                    this.updatePositions();
                    members.forEach(m => { m.assembly = this; });
                }
                updatePositions() {
                    let sx = 0, sy = 0;
                    this.members.forEach(m => { sx += m.x; sy += m.y; });
                    this.x = sx / this.members.length;
                    this.y = sy / this.members.length;

                    const n = this.members.length;
                    const r = 24;
                    this.members.forEach((m, idx) => {
                        const ang = (idx / n) * Math.PI * 2;
                        m.x = this.x + Math.cos(ang) * r;
                        m.y = this.y + Math.sin(ang) * r;
                        m.wanderTimer = 2.0;
                    });
                }
                disband(reason) {
                    this.members.forEach(m => {
                        m.assembly = null;
                        m.assemblyCooldown = 4.0;
                        if (reason === 'police') {
                            m.scatter = 1.4;
                            m.wanderAngle = Math.random() * Math.PI * 2;
                        }
                    });
                }
                draw(ctx) {
                    ctx.save();
                    const pulse = Math.sin(Date.now() * 0.005 + this.seed) * 3;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius + pulse, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 159, 67, 0.12)';
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(255, 159, 67, 0.55)';
                    ctx.lineWidth = 1.5;
                    ctx.setLineDash([4, 4]);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    ctx.font = '18px "Segoe UI Emoji", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('💬', this.x, this.y - this.radius - 8 + pulse * 0.5);
                    ctx.restore();
                }
            }

            function updateAssemblies(dt) {
                if (!memoryUnlocked) {
                    assemblies = [];
                    return;
                }

                // 1. Actualizar asambleas existentes
                for (let i = assemblies.length - 1; i >= 0; i--) {
                    const asm = assemblies[i];
                    asm.timer -= dt;
                    asm.members = asm.members.filter(m => !m.collected && m.free);

                    if (asm.members.length < 2 || asm.timer <= 0) {
                        asm.disband('timeout');
                        assemblies.splice(i, 1);
                        continue;
                    }

                    // Amenaza policial o nubes de gas
                    let threatened = false;
                    for (let p of policeUnits) {
                        if (p.stunTimer > 0) continue;
                        if (Math.hypot(p.x - asm.x, p.y - asm.y) < 95) {
                            threatened = true;
                            break;
                        }
                    }
                    if (!threatened) {
                        for (let g of gasClouds) {
                            if (Math.hypot(g.x - asm.x, g.y - asm.y) < g.radius + asm.radius) {
                                threatened = true;
                                break;
                            }
                        }
                    }

                    if (threatened) {
                        asm.disband('police');
                        floatingMessages.push({
                            text: '¡Asamblea dispersada por la policía!',
                            life: 1.3,
                            color: '#ff6b81',
                            x: asm.x,
                            y: asm.y - 30,
                            small: true
                        });
                        assemblies.splice(i, 1);
                        continue;
                    }

                    asm.updatePositions();
                }

                // 2. Formar nuevas asambleas espontáneas (máximo 2 simultáneas)
                if (assemblies.length < 2) {
                    const candidates = citizens.filter(c =>
                        !c.collected && c.free && !c.assembly &&
                        c.gassed <= 0 && c.demobilized <= 0 &&
                        c.scatter <= 0 && (c.assemblyCooldown || 0) <= 0 &&
                        c.pickupLock <= 0
                    );

                    for (let i = 0; i < candidates.length; i++) {
                        if (assemblies.length >= 2) break;
                        const c1 = candidates[i];
                        if (c1.assembly) continue;

                        const neighbors = [];
                        for (let j = i + 1; j < candidates.length; j++) {
                            const c2 = candidates[j];
                            if (c2.assembly) continue;
                            if (Math.hypot(c1.x - c2.x, c1.y - c2.y) < 60) {
                                neighbors.push(c2);
                                if (neighbors.length === 2) break;
                            }
                        }

                        if (neighbors.length >= 1) {
                            const group = [c1, ...neighbors];
                            const gx = group.reduce((s, c) => s + c.x, 0) / group.length;
                            const gy = group.reduce((s, c) => s + c.y, 0) / group.length;
                            const safe = !policeUnits.some(p => p.stunTimer <= 0 && Math.hypot(p.x - gx, p.y - gy) < 135);

                            if (safe) {
                                assemblies.push(new CitizenAssembly(group));
                            }
                        }
                    }
                }
            }

            class SafeZone {
                constructor(x, y, radius, permanent, name = '', message = '') {
                    this.x = x;
                    this.y = y;
                    this.radius = radius;
                    this.timer = permanent ? Infinity : 10;
                    this.active = true;
                    this.permanent = permanent;
                    this.phase = Math.random() * Math.PI * 2;
                    this.name = name;
                    this.message = message;
                    this.messageShown = false;
                }
                update(dt) {
                    if (!this.permanent) { this.timer -= dt; if (this.timer <= 0) this.active = false; }
                    this.phase += dt * 2;
                }
                draw(ctx) {
                    const alpha = this.active ? (0.3 + Math.sin(this.phase) * 0.1) : 0;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(46, 213, 115, ${alpha})`;
                    ctx.fill();
                    ctx.strokeStyle = `rgba(46, 213, 115, ${alpha * 2})`;
                    ctx.lineWidth = 2;
                    ctx.setLineDash([8, 4]);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    if (healthUnlocked && this === resistanceFocus) {
                        ctx.font = '18px "Segoe UI Emoji", sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText('🏥', this.x, this.y + this.radius - 14);
                    }

                    if (this.name) {
                        ctx.fillStyle = '#2ed573';
                        ctx.font = 'bold 12px "Inter", sans-serif';
                        ctx.textAlign = 'center';
                        ctx.shadowColor = '#000';
                        ctx.shadowBlur = 4;
                        ctx.fillText(this.name, this.x, this.y - this.radius - 10);
                        ctx.shadowBlur = 0;
                    }
                }
                contains(px, py, r = 0) { return Math.hypot(px - this.x, py - this.y) < this.radius + r; }
            }

            class Flag {
                constructor(x, y) {
                    this.x = x;
                    this.y = y;
                    this.poleX = x;
                    this.poleY = y - 25;
                    this.wave = 0;
                }
                update(dt) { this.wave += dt * 5; }
                draw(ctx) {
                    ctx.strokeStyle = '#bdc3c7';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.moveTo(this.poleX, this.poleY);
                    ctx.lineTo(this.poleX, this.poleY + 50);
                    ctx.stroke();

                    const off = Math.sin(this.wave) * 4;
                    ctx.fillStyle = '#ff3838';
                    ctx.beginPath();
                    ctx.moveTo(this.poleX, this.poleY);
                    ctx.lineTo(this.poleX + 40 + off, this.poleY + 15);
                    ctx.lineTo(this.poleX + 35 + off, this.poleY + 25);
                    ctx.lineTo(this.poleX, this.poleY + 30);
                    ctx.closePath();
                    ctx.fill();

                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 16px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('★', this.poleX + 18, this.poleY + 18);
                    ctx.textAlign = 'start';

                    const pulse = (Math.sin(this.wave * 1.5) + 1) / 2;
                    ctx.beginPath();
                    ctx.arc(this.poleX + 18, this.poleY + 25, 40 + pulse * 22, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(255,56,56,' + (0.55 - pulse * 0.4) + ')';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    const bobY = Math.sin(this.wave * 1.8) * 5;
                    ctx.fillStyle = '#ff3838';
                    ctx.beginPath();
                    ctx.moveTo(this.poleX + 10, this.poleY - 26 + bobY);
                    ctx.lineTo(this.poleX + 26, this.poleY - 26 + bobY);
                    ctx.lineTo(this.poleX + 18, this.poleY - 13 + bobY);
                    ctx.closePath();
                    ctx.fill();
                }
            }

            class Boss {
                constructor(x, y) {
                    this.x = x;
                    this.y = y;
                    this.radius = 45;
                    this.speed = 2.0;
                    this.hp = 100;
                    this.maxHp = 100;
                    this.phase = 1;
                    this.cooldown = 0;
                    this.charge = false;
                    this.chargeTarget = null;
                    this.stunTimer = 0;
                }
                update(dt, playerRef) {
                    if (this.stunTimer > 0) { this.stunTimer -= dt; return; }
                    this.cooldown -= dt;
                    if (this.hp < 50 && this.phase === 1) { this.phase = 2; this.speed = 2.8; }

                    if (this.charge) {
                        const ang = Math.atan2(this.chargeTarget.y - this.y, this.chargeTarget.x - this.x);
                        this.x += Math.cos(ang) * 6 * dt * 60;
                        this.y += Math.sin(ang) * 6 * dt * 60;
                        if (Math.hypot(this.x - this.chargeTarget.x, this.y - this.chargeTarget.y) < 30 || this.cooldown < -1) {
                            this.charge = false;
                            this.cooldown = 1.5;
                        }
                    } else if (playerRef && this.cooldown <= 0) {
                        const d = Math.hypot(this.x - playerRef.x, this.y - playerRef.y);
                        if (d < 350) {
                            this.chargeTarget = { x: playerRef.x, y: playerRef.y };
                            this.charge = true;
                            this.cooldown = 2.5 - this.phase * 0.5;
                        } else {
                            const ang = Math.atan2(playerRef.y - this.y, playerRef.x - this.x);
                            this.x += Math.cos(ang) * this.speed * dt * 60;
                            this.y += Math.sin(ang) * this.speed * dt * 60;
                        }
                    }
                    this.x = Math.max(this.radius, Math.min(W - this.radius, this.x));
                    this.y = Math.max(this.radius, Math.min(H - this.radius, this.y));
                }
                draw(ctx) {
                    if (assets.boss.complete && assets.boss.naturalWidth > 0) {
                        ctx.save();
                        ctx.translate(this.x, this.y);
                        if (this.chargeTarget && this.chargeTarget.x < this.x) ctx.scale(-1, 1);
                        const bob = Math.sin(Date.now() * 0.01) * 3;
                        ctx.drawImage(assets.boss, -this.radius, -this.radius + bob, this.radius * 2, this.radius * 2);
                        ctx.restore();
                    } else {
                        ctx.fillStyle = '#1e90ff';
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.strokeStyle = '#f1c40f';
                        ctx.lineWidth = 4;
                        ctx.stroke();
                        ctx.fillStyle = '#fff';
                        ctx.font = '20px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText('BOSS', this.x, this.y + 7);
                    }

                    ctx.fillStyle = '#2f3542';
                    ctx.fillRect(this.x - 40, this.y - this.radius - 20, 80, 10);
                    ctx.fillStyle = '#ff3838';
                    ctx.fillRect(this.x - 40, this.y - this.radius - 20, 80 * (this.hp / this.maxHp), 10);
                    ctx.strokeStyle = '#fff';
                    ctx.strokeRect(this.x - 40, this.y - this.radius - 20, 80, 10);
                }
                hit(dmg) {
                    this.hp = Math.max(0, this.hp - dmg);
                    this.stunTimer = 0.8;
                    this.charge = false;
                    cameraShake = 15;

                    for (let i = 0; i < 15; i++) {
                        particles.push({
                            x: this.x, y: this.y,
                            color: '#ff3838', life: 1.0,
                            vx: (Math.random() - 0.5) * 200, vy: (Math.random() - 0.5) * 200,
                            radius: 4,
                            update(dt) { this.life -= dt; this.x += this.vx * dt; this.y += this.vy * dt; },
                            draw(ctx) { ctx.globalAlpha = this.life; ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; },
                            alive() { return this.life > 0; }
                        });
                    }
                }
            }

            function spawnHealParticles(x, y) {
                for (let i = 0; i < 6; i++) {
                    particles.push({
                        x: x + (Math.random() - 0.5) * 20,
                        y: y + (Math.random() - 0.5) * 20,
                        color: '#2ed573', life: 0.6,
                        vx: (Math.random() - 0.5) * 60, vy: -35 - Math.random() * 35,
                        radius: 3.5,
                        update(dt) { this.life -= dt; this.x += this.vx * dt; this.y += this.vy * dt; },
                        draw(ctx) { ctx.globalAlpha = this.life * 1.6; ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; },
                        alive() { return this.life > 0; }
                    });
                }
            }

            // ==================== INICIALIZACIÓN DE NIVELES ====================
            function syncUnlocksForLevel(lvl) {
                if (lvl > 1) paceUnlocked = true;
                if (lvl > 2) memoryUnlocked = true;
                if (lvl > 3) healthUnlocked = true;
                if (lvl > 4) inclusiveUnlocked = true;
            }

                resizeCanvas();
                currentLevel = lvl;
                syncUnlocksForLevel(lvl);

                citizens = [];
                policeUnits = [];
                safeZones = [];
                particles = [];
                gasClouds = [];
                flag = null;
                boss = null;
                mobilization = { active: false, timer: 0, outcomeState: null, isFinal: false };
                floatingMessages = [];
                inclusiveCooldown = 0;
                bossWave = { active: false, timer: 0, pending: 0 };
                bureaucrats = [];
                assemblies = [];

            // ==================== HUD ====================
            function updateHUD(cfg) {
                const titlePrefix = currentLevel <= MAX_REGULAR_LEVELS ? `Nv.${currentLevel} · ` : `FINAL · `;
                hudLevelTitle.textContent = titlePrefix + (LEVEL_TITLES[currentLevel] || `Nivel ${currentLevel}`);

                const current = player ? player.getStrength() : 0;
                hudTotalStars.textContent = `${totalStarsEarned}/18`;

                if (currentLevel <= MAX_REGULAR_LEVELS && cfg) {
                    const req1 = cfg.required;
                    const req2 = Math.ceil(cfg.required * 1.10);
                    const req3 = Math.ceil(cfg.required * 1.20);

                    let currentStars = 0;
                    if (current >= req3) currentStars = 3;
                    else if (current >= req2) currentStars = 2;
                    else if (current >= req1) currentStars = 1;

                    hudLevelStars.style.display = 'inline-block';
                    const activeFist = '<span style="filter:drop-shadow(0 0 3px #ff3838)">✊</span>';
                    const dimFist = '<span style="opacity:0.25;filter:grayscale(1)">✊</span>';
                    hudLevelStars.innerHTML = currentStars === 3 ? (activeFist + activeFist + activeFist) :
                        (currentStars === 2 ? (activeFist + activeFist + dimFist) :
                        (currentStars === 1 ? (activeFist + dimFist + dimFist) :
                        (dimFist + dimFist + dimFist)));

                    starMarker1.style.display = 'block';
                    starMarker2.style.display = 'block';
                    starMarker3.style.display = 'block';

                    starMarker1.style.left = (req1 / req3 * 100) + '%';
                    starMarker2.style.left = (req2 / req3 * 100) + '%';
                    starMarker3.style.left = '97%';

                    starMarker1.classList.toggle('achieved', current >= req1);
                    starMarker2.classList.toggle('achieved', current >= req2);
                    starMarker3.classList.toggle('achieved', current >= req3);

                    if (flag) {
                        hudOrgCounter.textContent = `🚩 ¡BANDERA! (${current}/${req1})`;
                        hudProgress.classList.add('ready');
                    } else {
                        hudOrgCounter.textContent = `👥 ${current} / ${req1}`;
                        hudProgress.classList.remove('ready');
                    }
                    hudProgress.style.width = Math.min(100, (current / req3) * 100) + '%';
                } else {
                    // Boss level
                    hudLevelStars.style.display = 'none';
                    starMarker1.style.display = 'none';
                    starMarker2.style.display = 'none';
                    starMarker3.style.display = 'none';

                    const idx = Math.min(bossWavesFired, BOSS_WAVES_AT.length - 1);
                    const req = BOSS_WAVES_AT[idx];
                    hudOrgCounter.textContent = `👥 ${current} / ${req}`;
                    hudProgress.style.width = Math.min(100, (current / req) * 100) + '%';
                    hudProgress.classList.remove('ready');
                }

                hudTimer.textContent = formatTime(totalTime);
                hudLives.textContent = '❤'.repeat(Math.max(0, lives)) || '💔';

                // Solo mostrar en el HUD los bonos que ya fueron desbloqueados
                powerPaceBadge.classList.toggle('unlocked', paceUnlocked);
                powerMemoryBadge.classList.toggle('unlocked', memoryUnlocked);
                powerHealthBadge.classList.toggle('unlocked', healthUnlocked);
                powerInclusiveBadge.classList.toggle('unlocked', inclusiveUnlocked);
                powerInclusiveBadge.classList.toggle('on-cooldown', inclusiveUnlocked && inclusiveCooldown > 0);
                statusInclusive.textContent = inclusiveCooldown > 0 ? inclusiveCooldown.toFixed(1) + 's' : 'LISTO';
            }

            // ==================== INTERACCIONES Y COLISIONES ====================
            function playerCollect() {
                for (let i = citizens.length - 1; i >= 0; i--) {
                    const c = citizens[i];
                    if (c.collected || c.pickupLock > 0) continue;

                    if (Math.hypot(player.x - c.x, player.y - c.y) < player.radius + c.radius) {
                        const prevStrength = player.getStrength();
                        if (c.assembly) {
                            const asm = c.assembly;
                            const asmCount = asm.members.length;
                            const group = [...asm.members];
                            const asmIdx = assemblies.indexOf(asm);
                            if (asmIdx !== -1) assemblies.splice(asmIdx, 1);

                            group.forEach(m => {
                                m.assembly = null;
                                player.addCitizen(m);
                                const idx = citizens.indexOf(m);
                                if (idx !== -1) citizens.splice(idx, 1);
                            });
                            sfxCollect();
                            floatingMessages.push({
                                text: `💬 ¡Asamblea sumada! (+${asmCount})`,
                                life: 1.8,
                                color: '#ff9f43',
                                x: player.x,
                                y: player.y - 46,
                                small: true
                            });
                        } else {
                            player.addCitizen(c);
                            citizens.splice(i, 1);
                            sfxCollect();
                        }

                        const currentStrength = player.getStrength();
                        if (currentLevel <= MAX_REGULAR_LEVELS) {
                            const curCfg = getLevelConfig(currentLevel);
                            const req2 = Math.ceil(curCfg.required * 1.10);
                            const req3 = Math.ceil(curCfg.required * 1.20);
                            if (prevStrength < req2 && currentStrength >= req2) {
                                sfxStar();
                                floatingMessages.push({ text: '✊✊ ¡2 PUÑOS DE LUCHA! (+10% compañerxs)', life: 1.6, color: '#ff6b6b', x: player.x, y: player.y - 42, small: true });
                            } else if (prevStrength < req3 && currentStrength >= req3) {
                                sfxStar();
                                floatingMessages.push({ text: '✊✊✊ ¡3 PUÑOS EN ALTO! (+20% máxima unidad)', life: 2.0, color: '#ff4757', x: player.x, y: player.y - 42, small: true });
                            }
                        }

                        if (gameState === STATE.BOSS_BATTLE) {
                            if (bossWavesFired < BOSS_WAVES_AT.length && player.getStrength() >= BOSS_WAVES_AT[bossWavesFired]) {
                                bossWavesFired++;
                                triggerBossWave(bossWavesFired);
                            }
                        }
                        break;
                    }
                }
            }

            function policeCapture() {
                for (let p of policeUnits) {
                    if (p.stunTimer > 0) continue;
                    for (let c of citizens) {
                        if (c.collected || c.scatter > 0) continue;
                        if (Math.hypot(p.x - c.x, p.y - c.y) < p.radius + c.radius) {
                            c.scatter = 0.6;
                            c.wanderAngle = Math.atan2(c.y - p.y, c.x - p.x) + (Math.random() - 0.5) * 0.5;
                        }
                    }

                    const contact = Math.hypot(p.x - player.x, p.y - player.y) < p.radius + player.radius + 8;
                    if (!contact || player.invuln > 0) continue;

                    if (player.getStrength() > 0) {
                        player.loseCitizens(Math.min(3, player.getStrength()));
                                            } else {
                        lives--;
                        player.invuln = 2.0;
                        cameraShake = 18;
                        sfxBattle();
                        floatingMessages.push({ text: '¡DETENIDX! −1 ❤', life: 1.6, color: '#ff6b81', x: player.x, y: player.y - 44 });
                        if (lives <= 0) setGameOver();
                    }
                }
            }

            function bossCapture() {
                if (!boss || gameState !== STATE.BOSS_BATTLE || boss.stunTimer > 0 || player.invuln > 0) return;

                const contact = Math.hypot(boss.x - player.x, boss.y - player.y) < boss.radius + player.radius + 10;
                if (!contact) return;

                if (player.getStrength() > 0) {
                    player.loseCitizens(Math.min(3, player.getStrength()));
                                        floatingMessages.push({ text: '¡TE DESORGANIZÓ!', life: 1.2, color: '#ff6b81', x: player.x, y: player.y - 40, small: true });
                } else {
                    lives--;

                    sfxBattle();
                    floatingMessages.push({ text: '¡DETENIDX! −1 ❤', life: 1.6, color: '#ff6b81', x: player.x, y: player.y - 44 });
